# 依存の更新。週 1 回・グループ化で PR の洪水を避ける。
# 宛先は develop (バージョン更新のみ。セキュリティ更新の PR の宛先は、GitHub の仕様で既定ブランチになる)。
# Cargo.toml が無い間は、cargo の更新は「マニフェストが見つからない」と報告される (workspace を置くと解消する)。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # 自動の PR に混ぜずに、別に検討して上げるもの。
    # - redb: 保存の耐久性を S-01 で確かめた版 (03 §3.4) なので、版上げは試験と障害の注入の確認を付けた別の PR で行う。
    #   メジャー版は保存形式に関わるので、03 §12.2 の手順 (OQ-16) で上げる。4.6.0 は compact の試験の前提が変わる (#254)。
    # - blake2 の 0.x の版上げ (0.11 は digest 0.11 で API が変わる): 更新の署名の検証に使うので、別の PR で試験を付けて上げる。
    ignore:
      - dependency-name: "redb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "blake2"
        update-types: ["version-update:semver-minor"]
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
