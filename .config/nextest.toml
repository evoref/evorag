# cargo-nextest の profile (docs/11-dev-workflow.md §1、docs/09-testing-quality.md §6.2)。

[profile.default]
# 止まった試験を見つける。60 秒ごとに知らせ、5 回 (5 分) で打ち切る。
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# CI では失敗をすべて集める。揺れを隠さないため、再試行はしない。
fail-fast = false
retries = 0
failure-output = "immediate-final"

# 障害の注入の長い版 (EVORAG_FAULT_RUNS=1000) は時間がかかる (09 §4)。この試験だけ上限を 60 分にする。
[[profile.default.overrides]]
filter = 'test(committed_turns_survive_kills_at_random_points)'
slow-timeout = { period = "60s", terminate-after = 60 }

# 評価 (09 §5.2) は実際の llama-server で事例・問いを 1 件ずつ流すので長い。事実の想起は 2 時間、
# LongMemEval の一部は 4 時間を上限にする (`cargo xtask live-llm`・`cargo xtask longmemeval`)。
[[profile.default.overrides]]
filter = 'test(live_facts_are_recalled_in_a_new_session)'
slow-timeout = { period = "60s", terminate-after = 120 }

[[profile.default.overrides]]
filter = 'test(live_longmemeval_baseline)'
slow-timeout = { period = "60s", terminate-after = 240 }
