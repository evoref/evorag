# cargo-nextest の profile (docs/11-dev-workflow.md §1、docs/09-testing-quality.md §6.2)。

[profile.default]
# 止まった試験を見つける。60 秒ごとに知らせ、5 回 (5 分) で打ち切る。
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# CI では失敗をすべて集める。揺れを隠さないため、再試行はしない。
fail-fast = false
retries = 0
failure-output = "immediate-final"
