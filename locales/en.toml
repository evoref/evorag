[ui.private]
title = "Make private"
body = """{label}

This removes the value from the fact table and search keys, and replaces it with [hidden] in the exchanges attached by recall.
- The records are not deleted (/private off undoes it).
- It stays in the earlier conversation of the current session.
- This only stops sending the value to llama-server; anything llama-server has already kept is not erased."""
