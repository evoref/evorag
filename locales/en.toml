promise = """Promised (removed right away):
- evorag's database (the fact is retracted, messages are redacted, and records made from them are deleted; the database file is compacted at the next start)
- The conversation journal (lines from before the redaction are rewritten)
- The search index, the automatic backups (backups are recopied in the background) and quarantined records
- llama-server's slot cache for replies (erasure is requested; the default setup refuses it)

Not promised:
- Exported files, OS backups and snapshots, physical erasure on SSDs
- llama-server's logs and its in-memory prompt cache (may remain until llama-server restarts), and saved slots
- Free space in the database file until the next start, and journal lines that could not be rewritten (reported in the status line and by evorag doctor)
- Index segments that could not be deleted on Windows (deleted at the next start)
- Files in broken/ that you chose to keep when asked
- Anything done while an older version (v0.2.x) has the data open, reasons given with /bad, and session titles
- Other facts touched by the redaction (kept until you choose to forget them), the length of a value as revealed by the length of the redaction, and what can be guessed about a value from the block on learning it again"""
