[ui.help]
title = "Help (Esc to close)"
body = """
Enter send / Shift+Enter, Alt+Enter new line / Esc stop generating / Ctrl+E external editor / Tab choose a source or a possibly related record (Enter for details; in details, a attaches it and regenerates, x marks it irrelevant) / PageUp, PageDown scroll / Ctrl+C interrupt (twice on an empty input to quit) / Ctrl+Q quit

/help            this list
/new [title]     create a session
/sessions        list and resume sessions
/rename <title>  rename the current session
/delete          delete the current session (asks first)
/retry           regenerate the last reply
/good, /bad [reason]  rate the last reply
/model           show the recorded and connected models (switch with evorag setup)
/sources [on|off]  attach earlier conversations to replies (this session only)
/memory          records and band attached to the last reply, rerank scores, reasons for degraded recall, this session's sources, and the list of facts (F1…)
/memory accept F1    make the conflicting value the current value
/memory history F1   replacement history of that attribute (H1…); /memory revert H1 makes it current again
/memory forgotten    list of forgotten facts (X1…); /memory unblock X1 lifts the block on learning it again
/private F1      keep a fact out of replies (asks first); /private off F1 undoes it
/forget F1       forget a fact (asks first; by default redacts the source message)
/style [item value]  default answer style (language, length, format); without a value, opens a picker (applies to all sessions)
/quit            quit
//...            send text that starts with / as it is"""

