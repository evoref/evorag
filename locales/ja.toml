# 日本語の文言カタログ (docs/07-tui-config.md §6)。
# キーは evorag-types の MessageKey と一致させる (`cargo xtask i18n` で検査する、NFR-602)。
# 表は入れ子にしてよく、点でつないだ名前がキーになる。値は文字列だけ。

[error.llm]
connect = "llama-server に接続できません ({detail})。llama-server が動いているか、設定の接続先を確かめてください。"
http = "llama-server がエラーを返しました (HTTP {status}: {detail})。"
stream_cut = "応答の途中で接続が切れました ({detail})。受け取ったところまでを保存しました。発話は残っているので、送り直せます。"
server = "llama-server が生成の途中でエラーを返しました ({detail})。受け取ったところまでを保存しました。"
protocol = "llama-server から想定と違う応答が返りました ({detail})。"

[error.send]
not_saved = "発話を保存できなかったので、送りませんでした ({detail})。入力欄に戻しました。"

[error.response]
not_saved = "応答を保存できませんでした ({detail})。"

[error]
busy = "応答を生成しています。Esc で中断してから送ってください。"
no_session = "セッションが開いていません。"
nothing_to_retry = "作り直す発話がありません。"
nothing_to_rate = "評価する応答がありません。"
unknown_model = "モデルの候補「{name}」は設定にありません (設定の [[llm.chat.models]] に名前と url を書きます)。"
delete_failed = "セッションを消せませんでした ({detail})。"
source_not_found = "出典 [{n}] が見つかりません (消したセッションの出典かもしれません)。"

[response]
interrupted = "中断しました。受け取ったところまでを保存しました。"
interrupted_by_shutdown = "終了のため中断しました。受け取ったところまでを保存しました。"

[ui]
you = "あなた"
assistant = "evorag"
thinking = "(考えています…)"
quit_hint = "もう一度 Ctrl+C で終了します。"
default_session_title = "新しい会話"

[ui.mark]
interrupted = "(中断)"
failed = "(失敗)"
no_reply = "(応答なし)"

[ui.status]
idle = "待機中"
generating = "生成中 (Esc で中断)"
thinking = "考えています (Esc で中断)"

[ui.title]
session = "セッション: {title}"
no_session = "(セッションなし)"

[ui.sessions]
title = "セッション (↑↓ で選び Enter で開く、Esc で閉じる)"
empty = "セッションはまだありません。"

[ui.delete]
confirm = "セッション「{title}」を消しますか? このセッションの会話がすべて消え、元に戻せません (自動の退避からも消します)。 y で消す / n でやめる"

[ui.help]
title = "ヘルプ (Esc で閉じる)"
body = """
Enter 送信 / Shift+Enter・Alt+Enter 改行 / Esc 生成の中断 / Ctrl+E 外部のエディタ / Tab 出典の番号を選ぶ (Enter で表示) / PageUp・PageDown スクロール / Ctrl+C 中断 (入力欄が空なら 2 回で終了) / Ctrl+Q 終了

/new [題名]      セッションを作る
/sessions        セッションの一覧と再開
/rename <題名>   今のセッションを改名する
/delete          今のセッションを消す (確認あり)
/retry           直前の応答を作り直す
/good, /bad [理由]  直前の応答を評価する
/model [名前]    使っているモデルの表示と、設定にある候補への切り替え
/sources [on|off]  以前の会話を応答に添えるか (このセッションだけ)
/quit            終了
//...            / で始まる文をそのまま送る"""

[ui.notice]
rated_good = "評価 (good) を記録しました。"
rated_bad = "評価 (bad) を記録しました。"
deleted = "セッションを消しました。"
renamed = "セッションの名前を「{title}」にしました。"
draft_restored = "前回の書きかけを入力欄に戻しました。"
model = "モデル: {current} ({model}、n_ctx {n_ctx})。候補: {choices}"
sources_on = "このセッションでは、以前の会話を応答に添えます (/sources off で止めます)。"
sources_off = "このセッションでは、以前の会話を応答に添えません (/sources on で戻します)。"
source_selected = "出典 [{n}] を選んでいます (Enter で表示、Tab で次へ、Esc でやめる)。"
source = "[{n}] {title} ({at})\n{excerpt}"
no_sources = "出典の付いた応答がありません。"

[ui.error]
