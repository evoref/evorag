[cli]
model_mismatch = """応答のモデルが、このデータ根に記録したモデルと違います。
  記録したモデル: {recorded}
  繋がっているモデル: {connected}
会話のデータには触れていないので、無事です。次のどれかを選んでください。
  1. 記録したモデル ({recorded}) で llama-server を起動し直す。
  2. evorag setup で切り替える (応答のモデルの切り替えでは、やり直すものはありません)。
  3. 試すだけなら、別のデータ根を使う: evorag --data-root <別のフォルダ>{hint}"""
model_mismatch_same_meta = """
ファイル名だけが違い、モデルの値 (パラメータ数・大きさ・語彙数) は同じです。同じモデルの可能性が高いので、evorag setup で「同じモデルとして扱う」を選べます。"""
model_recorded = "応答のモデル ({file}) を、このデータ根に記録しました。以後、違うモデルでは起動しません (切り替えは evorag setup で行います)。"
model_recorded_unusual = "応答のモデル ({file}) を、このデータ根に記録しました。これまでの会話で多く使っていたモデルとは違います。違うなら、evorag を閉じて evorag setup で直せます。"
