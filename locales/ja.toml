[ui.help]
title = "ヘルプ (Esc で閉じる)"
body = """
Enter 送信 / Shift+Enter・Alt+Enter 改行 / Esc 生成の中断 / Ctrl+E 外部のエディタ / Tab 出典と関係しそうな記録を選ぶ (Enter で詳細。詳細で a 添えて作り直す・x 無関係の印) / PageUp・PageDown スクロール / Ctrl+C 中断 (入力欄が空なら 2 回で終了) / Ctrl+Q 終了

/help            この一覧
/new [題名]      セッションを作る
/sessions        セッションの一覧と再開
/rename <題名>   今のセッションを改名する
/delete          今のセッションを消す (確認あり)
/retry           直前の応答を作り直す
/good, /bad [理由]  直前の応答を評価する
/model           記録したモデルと繋がっているモデルの表示 (切り替えは evorag setup)
/sources [on|off]  以前の会話を応答に添えるか (このセッションだけ)
/memory          直前の応答に添えた記録・候補の帯・リランクの値・縮退の理由、このセッションの出典、事実の一覧 (F1…)
/memory accept F1    矛盾の値を今の値にする
/memory history F1   その属性の置き換えの履歴 (H1…)。/memory revert H1 で今の値に戻す
/memory forgotten    忘れた事実の一覧 (X1…)。/memory unblock X1 で再び覚えない印を解く
/private F1      事実を応答に添えないようにする (確認あり)。/private off F1 で解く
/forget F1       事実を忘れる (確認あり。既定では出典の発話を伏せ字にする)
/style [項目 値]  答え方の既定 (言語・長さ・書式)。値なしで選ぶ窓を開く (すべてのセッションに効く)
/quit            終了
//...            / で始まる文をそのまま送る"""

