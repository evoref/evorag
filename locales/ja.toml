editor = "外部のエディタで開けませんでした ({detail})。環境変数 VISUAL か EDITOR でエディタを指定できます。"

[cli]
llm_unreachable = "llama-server ({url}) に接続できません: {detail}\nllama-server を起動してから、もう一度 evorag を起動してください。接続先の設定は evorag setup で作れます。"
data_root_unusable = "データ根を使えません: {detail}"
config_error = "設定ファイルに誤りがあります: {detail}"
config_ignored = "設定のキー {key} は、この版ではまだ使いません (無視します)。"
config_migrated = "設定ファイル {path} を今の版の形に書き換えました (元のファイルは {backup} に残しました)。"
prompt_language_fixed = "プロンプトの言語は、このデータ根では {recorded} に決まっています。設定の prompt.language は使いません。"
error = "エラー: {detail}"
unsafe_location = "データ根か退避先が危ない置き場所です: {detail}\n同期フォルダやネットワークの上では、データが壊れることがあります。別の場所を --data-root か設定の storage.data_root で指定してください。どうしても使うときは、設定に storage.allow_unsafe_location = true を書くと警告だけになります。"
location_warning = "置き場所の注意: {detail}"
broken = "データベースのファイルが壊れていたので、消さずに {moved_to} へ移しました ({reason})。"
ask_restore = "最新の退避とジャーナルから会話を戻しますか?"
restored = "退避 {from} から戻しました。その後の会話はジャーナルから足します。"
restored_from_journal = "退避が無いので、ジャーナルだけから会話を作り直します。"
exported = "{count} 件の記録 ({kinds}) を {path} に書き出しました。設定は API キーを除いて config.toml に写しました。"
export_skipped = "読めないので書き出さなかった記録: 新しい版の形 {newer} 件、壊れた記録 {corrupt} 件"
export_pending = "ジャーナルに、まだデータベースに入っていない {count} 行があります。evorag を一度起動して終了してから書き出すと、それも含まれます。"
export_not_empty = "{path} は空ではありません。空のフォルダか、まだ無いフォルダを指定してください。"
setup_guide = """
llama-server が見つかりませんでした (探した接続先: {tried})。設定ファイルは書いていません。
次の手順で llama-server を用意してから、もう一度 evorag setup を実行してください。

1. llama.cpp の配布物 (https://github.com/ggml-org/llama.cpp/releases) から、お使いの PC に合う llama-server を入手します。
2. GGUF 形式のモデルを用意します。
3. 自分の PC の中だけで受け付けるように、API キーを付けて起動します。例:
     llama-server -m <モデル>.gguf --host 127.0.0.1 --port 8080 -c 8192 --jinja --api-key <長いランダムな文字列>
4. 同じ文字列を環境変数 (例: EVORAG_API_KEY) に入れてから、次を実行します:
     evorag setup --api-key-env EVORAG_API_KEY
   別のポートで起動したときは --url http://127.0.0.1:<ポート> を付けます。"""
setup_needs_key = "llama-server ({url}) は API キーを求めています。キーを入れた環境変数の名前を --api-key-env で指定して、もう一度実行してください。"
setup_found = "llama-server を見つけました: {url} (モデル {model}、n_ctx {n_ctx}、{build})"
setup_ask_language = "システムプロンプトの言語を選んでください。このデータ根では後から変えられません [ja/en] (Enter で ja):"
setup_ask_overwrite = "設定ファイル {path} を書き換えますか? 元のファイルは {backup} に残します [y/N]:"
