[package]
name = "evorag"
description = "evorag: ローカルの llama-server を使うチャットと長期メモリのツール"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "evorag"
path = "src/main.rs"

[dependencies]
evorag-types = { workspace = true }
evorag-core = { workspace = true }
evorag-llm = { workspace = true }
evorag-memory = { workspace = true }
evorag-store = { workspace = true }
evorag-tui = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }

[dev-dependencies]
ciborium = { workspace = true }
evorag-store = { workspace = true }

[lints]
workspace = true
