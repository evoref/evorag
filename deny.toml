# cargo-deny の設定。依存のライセンス・脆弱性・取得元を検査する。
# evorag は Apache-2.0 で公開し、公開 crate を外部の消費者が静的リンクできるように、
# GPL / AGPL / LGPL の依存を禁止する。許可リストを変えるときは about.toml (置いたとき) も同時に直す。

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    # Linux の配布物 (musl 静的版)
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = true

[advisories]
# 脆弱性の例外の唯一の置き場所。
# 依存の脆弱性で evorag の使い方では到達しないものだけ、到達しない理由と期限を書いて載せる。
ignore = []

[licenses]
# 許可リスト。`OR` で結ばれた表記は、いずれかがこのリストにあれば通る。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016", # 古い版の unicode-ident 等
    "0BSD",
    "BSL-1.0", # Boost Software License (Business Source License とは別物)
    "CC0-1.0", # データ・小規模 crate 限定 (notify の最新版は CC0-1.0 のみ)
]
# MPL-2.0 と OpenSSL / ISC (ring / aws-lc-rs) は個別に承認する。
# 承認したら、該当の依存を入れるときに exceptions に crate 名つきで足し、承認の理由を PR に書く。
exceptions = []
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 内の path 依存はワイルドカードの版指定を許す。
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
