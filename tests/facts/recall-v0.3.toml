# 事実の想起の事例 (09 §5.2 の「事実の想起」、08 §2.4 の v0.3 の合格条件 (3))。
# 会話はすべて架空で、実在の人物・個人情報・利用者の会話の実例を含まない (11 §9.7)。
#
# [[case]]:
#   id         事例の ID (ファイルの中で一意)。F は事実を答える事例、A は答えの無い問い (Abstain)。
#   lang       データ根のプロンプトの言語 (ja / en)。省くと ja。
#   kind       fact (1 回言った事実) / correction (「〜じゃなくて〜」の訂正) / update (別のセッションで言い直した
#              新しい値) / multi (複数のセッションで足した多値) / abstain (言っていない事実を問う)。
#   attributes 確かめる属性 (crates/evorag-memory/attributes.toml の名前)。abstain は問うた属性。
#   sessions   以前のセッションの並び。各セッションはターンの並び ("U: " は利用者、"A: " は応答。U から始めて交互)。
#   question   新しいセッションで送る問い。
#   expect     答えに含まれるべき値 (すべて)。各項目は文字列か、どれか 1 つでよい別表記の並び。
#              比べる前に、答えと値の両方を NFKC・小文字にし、空白の並びを 1 つの空白にする。
#              abstain は空にする (答えに「分からない」旨の印があれば合格。印の一覧は試験のコードにある)。
#   facts_expect (任意) sleep-time の後の事実の一覧 (結果の `facts`、/memory の行) に含まれるべき行。各項目は
#              "<主語>/<属性>=<値> (<状態>, <時制>)" (状態は Live / Contested / Superseded、時制は Current /
#              Past / Planned) の文字列か、どれか 1 つでよい別表記の並び。
#   facts_forbid (任意) Live で残ってはならない組 "<主語>/<属性>=<値>" の並び (時制は問わない。Superseded など
#              で残るのはよい)。
#              どちらも、答えと同じ正規化をしてから比べる。書いた事例は「事実の正しさ」(facts_correct) に数える
#              が、合否 (expect) には使わない (09 §5.2)。答えからは見えにくい抽出の誤りを確かめる事例に書く。

# --- 1 回言った事実 (日本語) ---

[[case]]
id = "F01"
kind = "fact"
attributes = ["residence"]
sessions = [[
  "U: 最近、仙台に住んでいて冬の寒さがこたえます。暖房を効率よく使うコツはありますか？",
  "A: 厚手のカーテンで窓からの冷気を防ぎ、サーキュレーターで暖かい空気を循環させると効率が上がります。",
  "U: 加湿もしたほうがいいですか？",
  "A: 湿度を40〜60%に保つと体感温度が上がり、乾燥も防げます。",
]]
question = "私が住んでいる街、どこだったか覚えてる？"
expect = ["仙台"]
facts_expect = ["self/residence=仙台 (Live, Current)"]

