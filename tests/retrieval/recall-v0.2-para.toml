# 共通の文字の無い言い換えの事例 (09 §5.2、AC-FR-403-1)。問いと正解の往復は、漢字と英数字を 1 文字も
# 共有しない (仮名と記号は数えない)。語彙の索引では当たらず、ベクトルの候補からだけ届く。
# 会話はすべて架空で、実在の人物・個人情報を含まない (11 §9.7)。
#
# [[session]]: id・題と、ターン ("U: " は利用者、"A: " は応答)。ターンの ID は "<id>-tMM"。
# [[case]]: id・正解のターン・問い。問いは新しいセッションで送る。

