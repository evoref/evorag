# 想起の事例 (09 §5.2、AC-FR-402-1)。初版は S-04 の作った会話と事例 (spikes/S-04/REPORT.md)。
# 会話はすべて架空で、実在の人物・個人情報を含まない (11 §9.7)。
#
# [[session]]: id・日付・題と、ターン ("U: " は利用者、"A: " は応答)。
#   ターンの ID は "<id>-tMM" (MM は 1 から。奇数が利用者、偶数が応答)。
# [[case]]: id・区分 (easy / variant / para / none)・問いのセッション ("new" か、候補から除くセッション)・
#   正解のターン (空なら関係の無い問い)・問い。

[[session]]
id = "s01"
date = "2025-10-02"
title = "京都旅行の計画"
turns = [
  "U: 11月の連休に京都へ二泊三日で旅行したいんだけど、紅葉を見るならどこがおすすめ？",
  "A: 紅葉なら東福寺の通天橋、嵐山、永観堂が定番です。11月下旬が見頃になりやすいので、早朝に行くと混雑を避けられます。",
  "U: 嵐山に行くなら、何時ごろ着くのがいい？",
  "A: 渡月橋や竹林の小径は朝8時前だと人が少なめです。嵯峨野線の始発に近い電車で向かうのがおすすめです。",
  "U: 宿は京都駅の近くと四条のあたり、どっちが便利？",
  "A: 移動の中心が嵐山や東山なら四条河原町周辺が便利です。新幹線の乗り降りを重視するなら京都駅周辺が楽です。",
  "U: バスはかなり混むって聞いたけど本当？",
  "A: 紅葉の時期の市バスはとても混みます。地下鉄と京阪、JRを組み合わせて、バスは短い区間だけにすると時間が読みやすくなります。",
  "U: 食べ物では何を食べておくべき？",
  "A: 湯豆腐、にしんそば、おばんざいが定番です。嵐山の湯豆腐は昼に予約しておくと待たずに入れます。",
  "U: 予算はひとり5万円くらいで足りるかな。",
  "A: 交通費を除いて宿二泊で3万円前後、食事と拝観料で1万5千円ほど見ておけば、5万円に収まりやすいです。",
  "U: ありがとう、通天橋は朝一で行くことにする。",
  "A: 東福寺は9時ごろに開くので、開門の少し前に着くと落ち着いて見られます。",
]

[[session]]
id = "s02"
date = "2025-07-15"
title = "北海道旅行"
turns = [
  "U: 8月に北海道に行くんだけど、札幌から小樽まではどうやって移動するのがいい？",
  "A: 札幌から小樽はJRの快速エアポートで約40分です。本数も多いので電車が便利です。",
  "U: 富良野のラベンダーも見たいんだけど、レンタカーは借りたほうがいい？",
  "A: 富良野や美瑛は見どころが点在しているので、レンタカーがあると効率よく回れます。ラベンダーの見頃は7月中旬までなので、8月だと少し遅いかもしれません。",
  "U: 北海道で運転するとき気をつけることは？",
  "A: 一般道でも速度が出やすく、鹿が飛び出すことがあります。ガソリンスタンドの間隔が長い区間もあるので、早めに給油してください。",
  "U: 夏でも上着はいる？",
  "A: 朝晩は15度前後まで下がることがあるので、薄手の上着を一枚持っていくと安心です。",
  "U: 海鮮丼を食べるならどこ？",
  "A: 小樽の三角市場や札幌の二条市場が有名です。朝早いほうがネタの種類が多いです。",
  "U: ジンギスカンも食べたい。",
  "A: 札幌のすすきの周辺にジンギスカンの専門店が多くあります。煙がつくので、においが気になる服は避けると良いです。",
  "U: 新千歳空港のお土産でおすすめある？",
  "A: 定番は白い恋人やロイズの生チョコです。生チョコは保冷バッグがあると持ち帰りやすいです。",
]

[[session]]
id = "s03"
date = "2025-06-03"
title = "沖縄旅行"
turns = [
  "U: 9月に沖縄へ行く予定。台風が心配なんだけど、どうしたらいい？",
  "A: 9月は台風が多い時期です。キャンセル料の条件を確認し、旅行保険や変更のしやすい航空券を選んでおくと安心です。",
  "U: シュノーケリングは初心者でもできる？",
  "A: 青の洞窟などはガイド付きのツアーが多く、初心者でも参加できます。ライフジャケットを着けるので泳ぎが苦手でも大丈夫です。",
  "U: 日焼け止めはどんなのがいい？",
  "A: サンゴに配慮した日焼け止めを選ぶ人が増えています。ラッシュガードを着ると塗り直しの手間も減ります。",
  "U: 那覇から美ら海水族館は遠い？",
  "A: 車で2時間ほどかかります。高速道路を使っても1時間半は見ておくと良いです。",
  "U: 沖縄そばのおすすめの食べ方は？",
  "A: コーレーグースという島唐辛子の泡盛漬けを少し垂らすと味が変わって楽しめます。",
  "U: 旅行の持ち物で忘れがちなものは？",
  "A: 水に濡れても良いサンダル、防水のスマホケース、酔い止めの薬が忘れやすいです。",
  "U: 雨の日に行けるところも知りたい。",
  "A: 首里城の周辺の資料館や国際通りの商店街、水族館など屋内の施設がおすすめです。",
]

[[session]]
id = "s04"
date = "2025-05-10"
title = "スパイスカレー"
turns = [
  "U: スパイスからカレーを作ってみたいんだけど、最初に揃えるスパイスは何？",
  "A: クミン、コリアンダー、ターメリック、チリペッパーの4つがあれば基本のカレーが作れます。",
  "U: 玉ねぎはどのくらい炒めればいい？",
  "A: 中火で15分から20分ほど、あめ色になるまで炒めると甘みとコクが出ます。最初に塩をひとつまみ入れると水分が早く抜けます。",
  "U: にんにくとしょうがは入れたほうがいい？",
  "A: にんにくとしょうがはすりおろして、玉ねぎを炒めた後に加えると香りが立ちます。",
  "U: 辛さを調整したいときは？",
  "A: チリペッパーの量で辛さを変えられます。子ども向けなら最後にヨーグルトを加えるとまろやかになります。",
  "U: 鶏肉はどの部位がいい？",
  "A: 鶏もも肉が柔らかく仕上がります。ヨーグルトに30分ほど漬けておくとさらに柔らかくなります。",
  "U: 作ったカレーは冷凍できる？",
  "A: じゃがいもを入れていなければ冷凍できます。小分けにして1か月ほどで食べ切るのがおすすめです。",
  "U: ガラムマサラはいつ入れるの？",
  "A: ガラムマサラは香りが飛びやすいので、火を止める直前に加えます。",
]

[[session]]
id = "s05"
date = "2025-02-20"
title = "食パン作り"
turns = [
  "U: 家で食パンを焼いてみたい。強力粉と薄力粉はどう違うの？",
  "A: 強力粉はたんぱく質が多く、こねるとグルテンができてふっくら膨らみます。食パンには強力粉を使います。",
  "U: 発酵の温度は何度くらいがいい？",
  "A: 一次発酵は30度前後で40分から60分が目安です。生地が2倍ほどに膨らめば十分です。",
  "U: 冬は部屋が寒くて発酵が進まないんだけど。",
  "A: オーブンの発酵機能を使うか、お湯を入れたボウルと一緒に発泡スチロールの箱に入れると温度を保てます。",
  "U: こねる時間はどれくらい？",
  "A: 手ごねなら10分から15分ほどです。生地を薄く伸ばして膜が張るようになれば十分です。",
  "U: オーブンの温度と時間は？",
  "A: 食パンは200度に予熱して25分から30分焼きます。焼き色が早くつくときはアルミホイルをかぶせます。",
  "U: 焼いたパンはどう保存する？",
  "A: 粗熱が取れたら切って一枚ずつラップで包み、冷凍すると2週間ほどおいしく食べられます。",
  "U: ホームベーカリーは買ったほうがいい？",
  "A: 毎週焼くなら便利ですが、まずは手ごねで何回か試してから決めても遅くありません。",
]

[[session]]
id = "s06"
date = "2025-03-08"
title = "週末の作り置き"
turns = [
  "U: 平日の夕食を楽にしたくて、週末に作り置きをしたい。何から始めればいい？",
  "A: 主菜を2品、副菜を3品くらいから始めると続けやすいです。日持ちする味付けの濃いものを中心にします。",
  "U: 鶏むね肉を安く買えたんだけど、パサつかない調理法は？",
  "A: 鶏むね肉は砂糖と塩を少し揉み込んでから、沸騰したお湯に入れて火を止め、余熱で火を通すとしっとりします。",
  "U: 作り置きは冷蔵で何日もつ？",
  "A: 冷蔵なら3日から4日が目安です。それ以上置くものは冷凍に回してください。",
  "U: 野菜の副菜でおすすめは？",
  "A: にんじんのラペ、ほうれん草のおひたし、きんぴらごぼうが日持ちしやすいです。",
  "U: お弁当にも入れたい。",
  "A: お弁当に入れるときは、汁気をよく切って、冷めてから詰めると傷みにくくなります。",
  "U: 保存容器はガラスとプラスチック、どっちがいい？",
  "A: ガラスはにおいや色が移りにくく、電子レンジでも使いやすいです。プラスチックは軽くて冷凍に向いています。",
  "U: 冷凍した肉の解凍はどうしたらいい？",
  "A: 前の晩に冷蔵庫へ移してゆっくり解凍すると、ドリップが出にくくなります。",
]

[[session]]
id = "s07"
date = "2025-04-12"
title = "観葉植物の世話"
turns = [
  "U: モンステラを買ったんだけど、水やりはどれくらいの頻度でするの？",
  "A: 土の表面が乾いてから、鉢の底から水が流れるくらいたっぷり与えます。春から秋は週に1回から2回、冬は2週間に1回くらいが目安です。",
  "U: 葉っぱが黄色くなってきた。",
  "A: 水のやりすぎによる根腐れか、日光不足が考えられます。受け皿に水が溜まっていないか確認してください。",
  "U: 日当たりはどこがいい？",
  "A: 直射日光は葉焼けの原因になるので、レースのカーテン越しの明るい窓辺が向いています。",
  "U: 肥料はあげたほうがいい？",
  "A: 成長期の5月から9月に、液体肥料を2週間に1回ほど薄めて与えると元気に育ちます。",
  "U: 植え替えはいつするの？",
  "A: 根が鉢の底から出てきたら、5月から6月ごろに一回り大きい鉢へ植え替えます。",
  "U: 葉にほこりがたまるのが気になる。",
  "A: 濡らした布で葉を拭くか、ときどき霧吹きで葉水をすると、ほこりが取れてハダニの予防にもなります。",
  "U: 旅行で一週間家を空けるときは？",
  "A: 出かける前にたっぷり水をやり、直射日光の当たらない場所に移しておけば一週間ほどは大丈夫です。",
]

[[session]]
id = "s08"
date = "2025-04-25"
title = "ベランダの家庭菜園"
turns = [
  "U: ベランダのプランターでミニトマトを育てたい。いつ植えればいい？",
  "A: ミニトマトの苗は4月下旬から5月中旬に植えるのが一般的です。深さ30cm以上のプランターを用意してください。",
  "U: わき芽って取ったほうがいいの？",
  "A: 主枝とは別に葉の付け根から出るわき芽は、小さいうちに手で摘み取ります。栄養が実に回りやすくなります。",
  "U: 水やりは毎日？",
  "A: 夏は朝に毎日たっぷりあげます。実がつき始めたら少し控えめにすると甘くなります。",
  "U: 支柱は必要？",
  "A: 背が高くなるので、植え付けのときに1.5mほどの支柱を立てて、茎をひもで結びます。",
  "U: 実が割れてしまうのはなぜ？",
  "A: 雨や水やりで急に水分を吸うと皮が割れます。雨の当たらない場所に置くと防げます。",
  "U: バジルを一緒に植えてもいい？",
  "A: バジルはトマトと相性が良いコンパニオンプランツです。同じプランターに植えても育ちます。",
  "U: 虫がついたらどうしよう。",
  "A: アブラムシは見つけたら粘着テープで取るか、水で洗い流します。牛乳を薄めてスプレーする方法もあります。",
]

[[session]]
id = "s09"
date = "2025-01-18"
title = "ノートパソコンの買い替え"
turns = [
  "U: 仕事用のノートパソコンを買い替えたい。メモリは何GBあればいい？",
  "A: ブラウザで多くのタブを開いたり、ビデオ会議をしたりするなら16GBがおすすめです。8GBだと動作が重くなることがあります。",
  "U: ストレージはSSDの容量どれくらい？",
  "A: 写真や資料を本体に置くなら512GBあると安心です。クラウド中心なら256GBでも足ります。",
  "U: CPUはIntelとAMDどっちがいい？",
  "A: 最近はどちらも性能が高く、価格と電池の持ちで選んで問題ありません。",
  "U: 画面の大きさは14インチと13インチで迷ってる。",
  "A: 持ち歩くことが多いなら13インチ、自宅での作業が中心なら14インチ以上が見やすいです。",
  "U: 重さはどれくらいが持ち運びやすい？",
  "A: 毎日持ち歩くなら1.3kg以下が目安です。",
  "U: 予算は15万円くらい。",
  "A: 15万円あればメモリ16GB、SSD 512GBの構成で選択肢が多くあります。",
  "U: USB-Cで充電できるほうがいい？",
  "A: USB-C充電に対応していると、スマホと充電器を共用できて荷物が減ります。",
]

[[session]]
id = "s10"
date = "2025-08-22"
title = "スマホの電池"
turns = [
  "U: スマホのバッテリーの減りが最近早い気がする。",
  "A: 設定の画面でバッテリーの最大容量を確認できます。80%を下回っていたら交換を考える時期です。",
  "U: 充電しながら使うのはよくない？",
  "A: 充電しながらゲームなど重い処理をすると発熱し、劣化が進みやすくなります。",
  "U: 充電は100%までしないほうがいいって本当？",
  "A: リチウムイオン電池は満充電の状態が続くと劣化しやすいので、80%で止める機能を使うと長持ちします。",
  "U: 電池の交換はいくらくらい？",
  "A: 機種によりますが、メーカーの修理で1万円前後が多いです。",
  "U: 寒いと電池が急に減るのはなぜ？",
  "A: 低温では電池の化学反応が鈍くなり、一時的に容量が減ったように見えます。暖かい場所に戻すと回復します。",
  "U: モバイルバッテリーを買うなら容量はどのくらい？",
  "A: スマホを1回から2回充電できる10000mAhが持ち運びと容量のバランスが良いです。",
  "U: 飛行機にモバイルバッテリーは持ち込める？",
  "A: 機内持ち込みはできますが、預け荷物には入れられません。容量の上限も航空会社で確認してください。",
]

[[session]]
id = "s11"
date = "2025-02-02"
title = "春の引っ越し"
turns = [
  "U: 春に引っ越すので賃貸の部屋を探してる。敷金と礼金って何が違うの？",
  "A: 敷金は退去時の修繕費などに充てる預け金で、残りは返ってきます。礼金は大家さんへのお礼で返ってきません。",
  "U: 初期費用は家賃の何か月分くらい見ておけばいい？",
  "A: 敷金・礼金・仲介手数料・前家賃などを合わせて、家賃の4か月から6か月分が目安です。",
  "U: 内見で見ておくべきところは？",
  "A: 日当たり、水回りのにおい、携帯の電波、収納の広さ、周りの騒音を確認してください。夜の雰囲気も見ておくと安心です。",
  "U: 住民票の手続きはいつまで？",
  "A: 引っ越してから14日以内に、新しい住所の役所で転入の届けを出します。他の市区町村からなら、先に転出の届けが要ります。",
  "U: 引っ越し業者は何社くらい比べる？",
  "A: 3社ほどから見積もりを取ると相場が分かります。3月は高くなるので、日程をずらせるなら4月以降が安めです。",
  "U: 退去のときの掃除はどこまでやる？",
  "A: 普段の掃除程度で大丈夫です。故意の傷や汚れは修繕費を請求されることがあるので、入居時に写真を撮っておくと良いです。",
  "U: インターネットの回線はいつ申し込む？",
  "A: 工事が必要な場合は1か月ほど待つことがあるので、物件が決まったらすぐ申し込むのがおすすめです。",
]

[[session]]
id = "s12"
date = "2025-01-30"
title = "確定申告"
turns = [
  "U: 去年は病院代がかなりかかったんだけど、医療費控除って使える？",
  "A: 1年間の医療費が10万円を超えると医療費控除が使えます。総所得が200万円未満なら所得の5%を超えた分が対象です。",
  "U: 薬局で買った風邪薬も入る？",
  "A: 治療のための市販薬も対象になります。レシートを保管しておいてください。",
  "U: ふるさと納税をしていると確定申告は必要？",
  "A: 寄付先が5自治体以内ならワンストップ特例で申告を省けます。ただし医療費控除で確定申告をするなら、ふるさと納税も申告に含める必要があります。",
  "U: 申告はいつまで？",
  "A: 確定申告の期間は2月16日から3月15日ごろまでです。還付だけの申告なら1月から出せます。",
  "U: スマホで申告できる？",
  "A: マイナンバーカードがあれば、スマホからe-Taxで申告できます。",
  "U: 通院の交通費も入るの？",
  "A: 電車やバスの交通費は対象になります。自家用車のガソリン代や駐車場代は対象外です。",
  "U: 領収書は提出するの？",
  "A: 今は医療費の明細書を出せばよく、領収書は5年間自宅で保管します。",
]

[[session]]
id = "s13"
date = "2025-05-28"
title = "ランニングを始めた"
turns = [
  "U: 最近ランニングを始めたら膝の外側が痛くなってきた。",
  "A: 膝の外側の痛みは腸脛靭帯炎、いわゆるランナー膝の可能性があります。痛みがあるうちは走る量を減らし、続くなら整形外科で診てもらってください。",
  "U: シューズはどう選べばいい？",
  "A: 初心者はクッション性の高いシューズがおすすめです。夕方の足がむくんだ時間に試し履きすると合うサイズが分かります。",
  "U: 週に何回走るのがいい？",
  "A: 始めのうちは週に2回から3回、1回20分から30分程度にして、間に休みの日を入れます。",
  "U: 走る前のストレッチは必要？",
  "A: 走る前は体を動かす動的ストレッチ、走った後は筋肉を伸ばす静的ストレッチが向いています。",
  "U: ペースはどのくらいで走ればいい？",
  "A: 会話ができるくらいのゆっくりしたペースが、脂肪を燃やすのにも故障を防ぐのにも向いています。",
  "U: 雨の日はどうしてる？",
  "A: 雨の日は室内で筋トレや踏み台昇降をすると、走る習慣を途切れさせずに済みます。",
  "U: いつか10kmの大会に出てみたい。",
  "A: 30分続けて走れるようになったら、3か月ほどかけて距離を伸ばせば10kmの大会に間に合います。",
]

