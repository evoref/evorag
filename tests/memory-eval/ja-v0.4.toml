# 日本語の想起の評価の事例 (09 §5.2 の「日本語の評価の事例」、v0.4)。LongMemEval が英語だけなので補う。
# 会話はすべて架空で、実在の人物・個人情報・利用者の会話の実例を含まない (11 §9.7)。
#
# 書式は tests/facts/recall-v0.3.toml と同じ。kind は次のとおり。
#   window     答えが、以前の応答の後ろのほう (400 文字より後) にある (05 §3.8 の文の窓)。
#   aggregate  答えが、複数のセッションの往復にまたがる (2 件目以降の往復を添える、05 §3.4)。
#   fact       利用者が 1 回言った事実。
#   abstain    以前の会話に答えが無い問い (答えに「分からない」旨の印があれば合格)。
# attributes は、事実の属性に当たるときだけ書く (無ければ空)。v0.4 は起点と比べて記録し、合否には使わない。

# --- 応答の後ろにある答え ---

[[case]]
id = "W01"
kind = "window"
attributes = []
sessions = [[
  "U: 初めてのソロキャンプで持っていくものを、くわしく教えてください。",
  "A: 準備の段階では、持っていく道具を一度家の庭や近くの公園で広げてみて、足りないものが無いかを確かめておくと、当日に慌てずに済みます。荷物はザックか大きめのコンテナにまとめ、重いものを下に、よく使うものを上に入れます。車で行く場合でも、駐車場からサイトまで歩いて運ぶことがあるので、一度に持てる量に分けておくと楽です。キャンプ場を予約するときは、炊事場とトイレの位置、チェックインの時刻、直火が使えるかどうかも確かめておきましょう。まず寝る道具です。テントは一人用の自立式が立てやすく、設営の練習を家でしておくと安心です。寝袋は使う季節の最低気温より5度ほど低い温度に対応したものを選びます。マットは地面の冷えと凹凸を防ぐので、寝袋と同じくらい大事です。次に食事の道具です。シングルバーナーとガス缶、小さな鍋、カトラリー、ゴミ袋を用意します。初回は火を使う料理を簡単にして、湯を沸かすだけで食べられるものを中心にすると片付けも楽です。明かりはヘッドランプとランタンを一つずつ持ち、予備の電池も忘れずに。天気が変わりやすい山のキャンプ場では、レインウェアと着替えを防水の袋に分けて入れておきます。最後に、いちばん忘れやすいのが、テントを地面に固定するためのペグを打つハンマーで、キャンプ場で借りられないことも多いので必ず持っていってください。",
  "U: ありがとう、リストにします。",
  "A: どういたしまして。初回は無理をせず、車で行ける区画サイトを選ぶと安心です。",
]]
question = "前に聞いたソロキャンプの持ち物で、いちばん忘れやすいと言われたものは何だった？"
expect = [["ハンマー", "ペグ"]]

[[case]]
id = "W02"
kind = "window"
attributes = []
sessions = [[
  "U: 家庭菜園でミニトマトを育てたいです。手順を教えてください。",
  "A: 育て始める前に、置き場所を決めておきましょう。ミニトマトは一日に6時間以上日が当たる場所を好み、風通しが悪いと病気が出やすくなります。ベランダなら、手すりの近くより少し内側のほうが強い風を避けられます。プランターの下にはすのこやレンガを置いて、底の穴から水がよく抜けるようにします。肥料は最初から培養土に入っているものを使うと手間が減りますし、植え付けの前に土を一度湿らせておくと根がなじみやすくなります。ミニトマトは日当たりと水はけが大事です。苗は茎が太く、葉の色が濃いものを選びます。植え付けは遅霜の心配がなくなってからにし、深さ30センチ以上のプランターに野菜用の培養土を入れます。植えたらたっぷり水をやり、支柱を立てて茎をひもで8の字に結びます。わき芽は小さいうちに手で摘み取ると、実に養分が回ります。水やりは土の表面が乾いてから、朝にたっぷり与えます。実がつき始めたら、2週間に1度ほど追肥をします。そして、実が割れるのを防ぐためにいちばん効くのは、雨の続く時期に急に水を与えすぎないことで、プランターを軒下に移すのが簡単な方法です。",
  "U: 軒下に移せばいいんですね。",
  "A: はい。日当たりが少し減っても、割れを防ぐほうが収穫は増えます。",
]]
question = "ミニトマトの実が割れるのを防ぐ方法、何て教えてもらったっけ？"
expect = ["軒下"]

[[case]]
id = "W03"
kind = "window"
attributes = []
sessions = [[
  "U: 自転車のチェーンの手入れの仕方を教えてください。",
  "A: 作業の前に、自転車をスタンドで立てるか、壁に立てかけて、ペダルを逆に回せる状態にしておきます。床が汚れないように新聞紙や段ボールを敷き、汚れてもよい手袋をはめておくと後片付けが楽です。用意するものは、使い古しのタオルや布のウエス、チェーン用のクリーナー、歯ブラシのような小さなブラシ、そしてチェーン用の油です。油には雨に強いものと汚れにくいものがあるので、乗る場所や季節に合わせて選びます。チェーンの手入れは、汚れを落とす、乾かす、油を差す、余分な油をふき取る、の順です。まずウエスでチェーンを挟み、ペダルを逆に回して表面の汚れを取ります。汚れがひどいときは、チェーン用のクリーナーを吹き付けてブラシでこすります。クリーナーを使ったら、水分や溶剤が残らないように十分に乾かします。油はチェーンのコマの一つ一つに一滴ずつ差し、ペダルを回してなじませます。最後にもう一度ウエスで表面をふき、外側に油が残らないようにします。外側に残った油は砂や泥を呼び寄せるからです。頻度の目安は、晴れの日に乗るなら月に1回、雨の中を走った後はその日のうちに行うことです。",
  "U: 雨の日は気をつけます。",
  "A: はい、雨の後に放っておくとすぐに錆びるので、早めの手入れがおすすめです。",
]]
question = "自転車のチェーンの手入れ、雨の中を走った後はいつまでにやるんだったっけ？"
expect = [["その日のうち", "その日"]]

[[case]]
id = "W04"
kind = "window"
attributes = []
sessions = [[
  "U: 来週、取引先との会議で初めて司会をします。進め方のコツはありますか？",
  "A: 初めての司会では、うまく話すことよりも、参加者が話しやすい場を作ることを意識すると気が楽になります。事前に参加者の名前と役割を確かめておき、当日は開始の数分前に入室して、画面共有や音声の具合を確かめておきます。取引先が相手の場合は、最初の挨拶で自社の参加者を簡単に紹介すると、相手も話しやすくなります。資料は事前に送ったものと同じ版を使い、途中で版が変わったときは、その場ではっきり伝えます。司会の役目は、時間どおりに終わらせ、決めるべきことを決めることです。前日までに議題と、それぞれの持ち時間を書いた進行表を参加者に送っておきます。当日は最初に会議の目的と終わりの時刻を伝えます。議題ごとに、話す人と決めることを確認してから始めると、話がそれにくくなります。発言が少ない人には、名前を呼んで意見を聞きます。話が長くなったら、要点をまとめて次に進むよう促します。決まったことと、誰がいつまでに何をするかは、その場で画面に書いて全員で確認します。そして最も大事なのは、会議の最後の5分を必ず空けておき、決定事項の読み上げに使うことです。",
  "U: 最後の時間を空けるのは知りませんでした。",
  "A: 読み上げると、聞き違いや決め忘れがその場で見つかります。",
]]
question = "会議の司会のコツで、最も大事だと言われたことは何だった？"
expect = [["5分", "５分", "読み上げ"]]

[[case]]
id = "W05"
kind = "window"
attributes = []
sessions = [[
  "U: 古いノートパソコンを売る前にやることを教えて。",
  "A: まず、売る先を決めておきましょう。買い取りの店、フリマアプリ、メーカーの下取りなどがあり、どこに売るかで、付属品や箱が要るかどうかが変わります。電源のアダプターや説明書が残っていれば、一緒に揃えておくと値段が上がりやすくなります。本体の汚れは、柔らかい布で拭き、キーボードのすき間のほこりはブラシで払っておきます。傷やバッテリーの状態は、写真に撮って正直に伝えると、後の行き違いを防げます。売る前の準備は、データの保存、アカウントの解除、初期化の3つです。まず、写真や書類を外付けのドライブかクラウドに保存します。保存できたか、別の機械で開いて確かめておくと安心です。次に、使っていたサービスからサインアウトします。メールやブラウザーの同期、写真の共有なども解除します。ソフトの中には、使える台数が決まっていて、古い機械の登録を外さないと新しい機械で使えないものがあります。最後にOSの機能で初期化します。このとき、ディスクを完全に消す設定を選ぶと時間はかかりますが安全です。それから、見落としがちなのが、パソコンのファームウェアに設定したパスワードで、これを解除しておかないと、買った人が起動できません。",
  "U: ファームウェアのパスワードは忘れていました。",
  "A: 売った後では解除できないので、初期化の前に外しておきましょう。",
]]
question = "パソコンを売る前に見落としがちだと言われたのは何？"
expect = ["ファームウェア"]

[[case]]
id = "W06"
kind = "window"
attributes = []
sessions = [[
  "U: 梅雨の時期に部屋干しの洗濯物が臭わないようにするには？",
  "A: まず、部屋干しの場所を見直してみましょう。窓際は外気との温度差で結露しやすく、かえって乾きにくいことがあります。部屋の中央や、空気の流れがある廊下に干すほうが早く乾くことも多いです。浴室乾燥機があれば、それを使うのも手です。また、洗濯機の槽そのものが汚れていると、洗っても臭いが移ります。月に一度は槽の洗浄をして、洗い終わったらふたを開けて中を乾かしておくと、臭いの元を減らせます。部屋干しの臭いは、乾くまでに時間がかかって菌が増えることが原因です。まず、洗濯が終わったらすぐに干します。洗濯機の中に置いたままにすると、それだけで菌が増えます。干すときは、洗濯物の間を握りこぶし一つ分ほど空け、長いものと短いものを交互に並べて空気が通るようにします。エアコンの除湿か除湿機を使い、扇風機やサーキュレーターで風を当てると、乾く時間が大きく縮みます。洗剤は部屋干し用のものを使い、量を守ります。多すぎるとすすぎ残しが臭いの元になります。それでも臭うタオルは、60度ほどのお湯に酸素系の漂白剤を溶かして、30分つけ置きしてから洗うと臭いが取れます。",
  "U: タオルが臭うので試してみます。",
  "A: つけ置きの後は、普段どおりに洗ってよく乾かしてください。",
]]
question = "臭うタオルをつけ置きするお湯は何度くらいって言われた？"
expect = [["60度", "６０度", "60"]]

