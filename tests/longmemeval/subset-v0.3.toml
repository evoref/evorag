# LongMemEval の一部 (09 §5.2 の「LongMemEval の一部」、08 §2.4 の v0.3 の合格条件 (6))。
#
# データそのものはリポジトリに置かない。流す人が source_url から取ってきて、`cargo xtask longmemeval --data <path>`
# に渡す。ここには、同じ一部を選び直せるように、元のファイルの名前と SHA-256、選び方、選んだ問いの ID だけを書く。
#
# - 元のデータ: LongMemEval (Wu ほか、2024)。MIT License, Copyright (c) 2024 Di Wu。
#   https://github.com/xiaowu0162/LongMemEval 、https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned
# - 版: oracle (以前の会話は、答えの根拠のセッションだけ。1 問あたり 1〜6 セッション)。S (約 40 セッション、
#   約 11.5 万トークン) は、1 問ごとに全発話を抽出に通すと局所の GPU で 50 問が数時間を超えるので使わない。
# - 選び方: single-session-preference (正解が採点の基準の文で、文字列の照合で判定できない) を除いた 470 問を、
#   question_type ごと (ID が `_abs` で終わる問いは abstention として別にする) の層に分け、50 問を数の比で
#   割り当てる (最大剰余法)。各層の中では、SHA-256("<seed>:<question_id>") の 16 進の小さい順に quota 件を取る。
#   試験 `longmemeval_subset_matches_the_data` (EVORAG_LONGMEMEVAL_DATA を置いたときだけ流す) が、データから
#   選び直して一致を確かめる。

