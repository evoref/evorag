[[ac]]
id = "AC-FR-211-1"
requirement = "FR-211"
level = "Must"
status = "test"
tests = ["crates/evorag-core/tests/forget_wiring.rs::repair_restores_lost_turns_and_lookups_and_replays_forgets", "crates/evorag-store/tests/repair.rs::missing_and_broken_records_come_back_from_the_journal_without_lowering_the_revision", "crates/evorag-store/tests/repair.rs::deleted_ids_are_not_restored_and_stale_records_are_removed", "crates/evorag-store/tests/repair.rs::intact_records_get_their_relations_back_and_unknown_names_are_kept", "crates/evorag-store/tests/repair.rs::relations_of_records_that_cannot_be_rederived_are_kept", "crates/evorag-store/tests/repair.rs::meta_lines_come_back_and_bad_lines_are_counted", "crates/evorag-store/tests/repair.rs::forget_recheck_is_set_whenever_a_forget_directive_exists", "crates/evorag-memory/src/kinds.rs::written_and_derived_names_are_declared_on_the_kind", "bins/evorag/tests/cli.rs::repair_backs_up_first_and_refuses_while_the_data_root_is_in_use", "bins/evorag/tests/cli.rs::repair_refuses_a_missing_data_root_and_points_a_broken_database_to_restore"]
manual = ""
note = "DB から消したターンと忘れるの指示がジャーナルから戻り (改訂の番号を下げる行は当てない)、消した副索引が作り直され、失った事実の取り消しとジャーナルの伏せ字の前の行の除去が当て直され、実行の前に退避が作られることで判定する。ストアの層は、壊れた記録の隔離、記録の無い ID の関係の除去、削除の行と cleanup.pending_deletes の ID を戻さないこと (DB に残っていた削除済みの記録が消えること)、失った関係の作り直し、作り直せない記録 (知らない種類・新しい版・読めない本体・壊れた記録) の関係と、知らない関係・副索引の項目を残すこと (03 §4.2 の規則 6・11)、ジャーナルの meta の行を戻すこと、忘れるの指示があれば forget.recheck を立てることも確かめる。種類の宣言 (derived_rels・derived_lookups) と derive・書き込みの経路が合うことは kinds.rs の試験で確かめる。CLI は、データ根が無いときに何も作らずに断ること、壊れた DB で restore を案内することも確かめる。"

