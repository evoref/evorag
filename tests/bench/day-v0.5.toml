  { dt = 12, role = "assistant", text = "三人とも忙しい方なら、最初のページに結論と頼みたいことをまとめておくと、読んでもらいやすいです。" },
  { dt = 70, role = "user", text = "なるほど。ちなみに私は港南台に住んでいて、出社の日は電車で四十分かかります。" },
  { dt = 10, role = "assistant", text = "港南台から四十分の通勤ですね。在宅の日は、その時間を資料作りに回せるのが助かりますね。" },
  { dt = 120, role = "user", text = "うちの柴犬のコムギが散歩を待っているので、少し抜けます。" },
  { dt = 8, role = "assistant", text = "いってらっしゃい。コムギちゃんとの散歩を楽しんでください。" },
  { dt = 1500, role = "user", text = "戻りました。見出しは五つにしました。" },
  { dt = 10, role = "assistant", text = "五つなら読みやすい量です。見出しごとに、伝えたいことを一文ずつ書いてみましょう。" },
  { dt = 180, role = "user", text = "三つ目の見出しの中身がうまく書けません。数字の比べ方で迷っています。" },
  { dt = 15, role = "assistant", text = "前の年と今年を並べた表にして、差がいちばん大きい項目だけを文で説明すると、伝わりやすくなります。" },
  { dt = 60, role = "user", text = "ok" },
  { dt = 5, role = "assistant", text = "ほかにも詰まったら、いつでも声をかけてください。" },
]

