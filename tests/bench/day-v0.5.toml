# BM-108 の見本の会話 (09 §5.1 の「BM-108 の流し方」、NFR-108、AC-NFR-108-1)。
# 作った 1 日分の会話。会話はすべて架空で、実在の人物・個人情報・利用者の会話の実例を含まない (11 §9.7)。
#
# 大きさ (09 §5.1): セッション 4、利用者の発話 30 (うち前のふるいで送らない挨拶・相槌・短いもの 5)。
# 短い発話と長い発話 (約 300 字のメモ 1 件)、ja を主に en を少し (en のセッション 1 と、ja のセッションの中の en の発話 1)。
# 区切り (04 §2) の決め方を通すために、次を含める。
#   - S1 の中の 25 分の間 (10 分を過ぎるので、そこで区切りが閉じる)。
#   - S3 の 9 往復 (区切りの上限の候補 8 往復を超える)。
#   - 訂正の候補 (「六歳じゃなくて七歳」) と、予定 (planned) の値。
#
# 書式:
#   version   見本の版 (中身を変えたら上げる。BM-108.json には、このファイルの SHA-256 を書く)。
#   tz        発話のターンに記録する UTC からのずれ。
#   [[session]]
#     id      事例の中のセッションの名前。
#     title   セッションの題名 (データ根に書く)。
#     start   セッションの最初のターンの時刻 (RFC 3339、tz と同じずれ)。
#     turns   ターンの並び。各々 { dt, role, text }。dt は前のターン (最初のターンはセッションの start) からの秒数。
#             role は user か assistant。利用者から始めて交互にする。応答は固定の文 (BM-108 では chat を呼ばない)。
#
# 流し方 (09 §5.1): 事例ごとに新しいデータ根を作り、この会話を書き込みの入口で時刻どおりに書いてから、
# 裏の処理を最後まで流す。捨てた率を測る回では、day-v0.5-ops.toml の操作の注入の列で裏の要求を止める。

version = 1
tz = "+09:00"

[[session]]
id = "S1"
title = "在宅勤務の資料作り"
