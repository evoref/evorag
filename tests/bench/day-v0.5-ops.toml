# BM-108 の操作の注入の列 (09 §5.1 の「BM-108 の流し方」の「捨てた率」を測る回)。
# 「利用者が操作する時刻」の列を、固定の種から決定論で作る。本文は持たない (件数と時間だけ)。
#
# 使い方: 見本の会話 (day-v0.5.toml) を書き込んだ後、裏の処理を流す。裏の処理が動いている時間 (裏の要求を
# 出している間の壁時計の時間。待機の判定を待つ時間は含めない) が run_ms[0] ミリ秒に達したら、利用者の操作
# (キー入力) を 1 回注入する。裏の処理は 04 §4 の「譲る」で 1 秒以内に要求を止める。止まったら、待機の時間
# (memory.idle_seconds) を待たずに裏の処理を再開し (待機を模すだけで、時間は数に入れない)、次は run_ms[1]
# ミリ秒に達したら注入する。列を使い切ったら、同じ手順で続きを生成する (count より先の値も同じ種で決まる)。
# 止めた呼び出しの数と、そのうち出力を捨てた数 (partial の台帳を残さなかった呼び出し) を BM-108.json に書く。
#
# 生成の手順 (整数だけで計算するので、OS や言語に依らず同じ列になる):
#   1. splitmix64 の状態を seed にする。次の値は、
#        state = state + 0x9E3779B97F4A7C15 (mod 2^64)
#        z = state
#        z = (z ^ (z >> 30)) * 0xBF58476D1CE4E5B9 (mod 2^64)
#        z = (z ^ (z >> 27)) * 0x94D049BB133111EB (mod 2^64)
#        値 = z ^ (z >> 31)
#   2. 各 run_ms は、次の値の上位 32 ビット x から作る。pos = x * 10、k = pos >> 32 (0〜9)、
#      frac = pos & 0xFFFFFFFF、run_ms = q[k] + (((q[k+1] - q[k]) * frac) >> 32) (q は quantiles_ms。
#      どの積も 2^64 を超えない)。
#      つまり、十分位の点 quantiles_ms の間を線形に補った経験分布から 1 つずつ引く。
#
# 分布 (quantiles_ms): 09 §5.1 は、v0.4 の M4.0 の手元のデータ根の待機の時間の実測 (件数と時間だけ) の分布から
# 作ると書く。その実測は、まだリポジトリに無い (docs/perf に記録が無い) ので、ここの十分位は暫定の値にした
# (provisional = true。中央値 42 秒・最小 3 秒・最大 10 分)。実測の十分位を取ったら quantiles_ms を差し替え、seed を変えずに
# 列を生成し直して provisional を外す。BM-108.json には seed と quantiles_ms を書く (09 §5.1 の「記録」)。
version = 1

seed = 20261126
count = 120
quantiles_ms = [3000, 8000, 14000, 21000, 30000, 42000, 58000, 80000, 120000, 200000, 600000]
provisional = true

