[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "b1", session = "B", at = "2026-02-01T09:00:00Z", text = "大阪のおすすめの店を教えて" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" }, echo = false }
[[case.step]]
expect = { turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいます" },
  { id = "b1", text = "大阪のおすすめの店を教えて" },
] }

[[case]]
id = "F08"
title = "ほかのターンもまとめて伏せる選択では、そのターンの一致も伏せ字にする"
spec = "04 §7.1"
[[case.step]]
