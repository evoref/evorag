[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "b1", session = "B", at = "2026-02-01T09:00:00Z", text = "大阪のおすすめの店を教えて" }
