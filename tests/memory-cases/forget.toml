expect = { facts = [
  { s = "self", a = "likes", v = "ラーメン", state = "Live", sources = ["b1"] },
], table = ["self/likes/ラーメン"] }

[[case]]
id = "F11"
title = "伏せ字の範囲の本文が忘れる値と合わなければ、操作の全体を中止し、本文も事実も変えない"
spec = "04 §7.3、AC-FR-307-5"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
tamper = { id = "a1", text = "私は京都に住んでいます" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" }, echo = false }
[[case.step]]
expect = { aborted = true, facts = [
  { s = "self", a = "residence", v = "大阪", state = "Live", sources = ["a1"] },
], turns = [
  { id = "a1", text = "私は京都に住んでいます" },
], blocked = [] }
