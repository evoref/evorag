# 忘れると伏せ字、想起での伏せ (04 §7.1〜§7.3・§7.5)。書式は README.md。会話はすべて架空 (11 §9.7)。
# 伏せ字の印は ja の `[伏せ字]`、想起での伏せは `[非表示]`。
# 伏せる範囲は、根拠の範囲の中の、値に一致する箇所 (README の「仕様の確認待ち」)。
# どの事例も、忘れるを 2 回当てた結果が 1 回と同じになること (apply_forget の冪等、AC-FR-307-4) も確かめる。

[[case]]
id = "F01"
title = "既定の忘れる: 出典の発話と、同じ往復の応答の中の値を伏せ字にし、印を残す"
spec = "04 §7.1・§7.2・§7.3"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "a2", session = "A", at = "2026-01-05T10:00:10Z", role = "assistant", text = "大阪にお住まいなんですね" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" } }
[[case.step]]
expect = { facts = [
  { s = "self", a = "residence", state = "Retracted", sources = ["a1"] },
], turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいます" },
  { id = "a2", text = "[伏せ字]にお住まいなんですね" },
], blocked = [{ s = "self", a = "residence", v = "大阪" }], table = [] }

[[case]]
id = "F02"
title = "応答の中の一致を伏せない選択では、利用者の発話だけを伏せ字にする"
spec = "04 §7.1"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "a2", session = "A", at = "2026-01-05T10:00:10Z", role = "assistant", text = "大阪にお住まいなんですね" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" }, echo = false }
[[case.step]]
expect = { turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいます" },
  { id = "a2", text = "大阪にお住まいなんですね" },
] }

[[case]]
id = "F03"
title = "伏せ字にしないで忘れると、本文は残し、想起で添えるときは値を [非表示] にする"
spec = "04 §7.1 の伏せ字にしないで忘れたとき"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "a2", session = "A", at = "2026-01-05T10:00:10Z", role = "assistant", text = "大阪にお住まいなんですね" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" }, redact = false }
[[case.step]]
expect = { turns = [
  { id = "a1", text = "私は大阪に住んでいます" },
  { id = "a2", text = "大阪にお住まいなんですね" },
], recall = [
  { turn = "a1", text = "私は[非表示]に住んでいます" },
  { turn = "a2", text = "[非表示]にお住まいなんですね" },
], blocked = [{ s = "self", a = "residence", v = "大阪" }] }

[[case]]
id = "F04"
title = "同じターンに 2 回目の忘れるを当てても、前の伏せ字で動いた位置を正しく扱う"
spec = "04 §7.3"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいて、柴犬を飼っています" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいて" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "pet", v = "柴犬", e = "柴犬を飼っています" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "大阪" }, echo = false }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "pet", v = "柴犬" }, echo = false }
[[case.step]]
expect = { facts = [
  { s = "self", a = "residence", state = "Retracted", sources = ["a1"] },
  { s = "self", a = "pet", state = "Retracted", sources = ["a1"] },
], turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいて、[伏せ字]を飼っています" },
] }

[[case]]
id = "F05"
title = "履歴もまとめて忘れると、置き換えた古い値の出典も伏せ字にする"
spec = "04 §7.1"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "b1", session = "B", at = "2026-02-01T09:00:00Z", text = "私は東京に引っ越しました" }
[[case.step]]
candidate = { turn = "b1", s = "self", a = "residence", v = "東京", e = "私は東京に引っ越しました" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "東京" }, history = true, echo = false }
[[case.step]]
expect = { facts = [
  { s = "self", a = "residence", state = "Retracted", sources = ["a1"] },
  { s = "self", a = "residence", state = "Retracted", sources = ["b1"] },
], turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいます" },
  { id = "b1", text = "私は[伏せ字]に引っ越しました" },
], blocked = [
  { s = "self", a = "residence", v = "大阪" },
  { s = "self", a = "residence", v = "東京" },
], table = [] }

[[case]]
id = "F06"
title = "選んだ値だけを忘れると、置き換えた古い値は残し、今の値なしになる (古い値を今の値に戻さない)"
spec = "04 §7.1・§7.4"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "b1", session = "B", at = "2026-02-01T09:00:00Z", text = "私は東京に引っ越しました" }
[[case.step]]
candidate = { turn = "b1", s = "self", a = "residence", v = "東京", e = "私は東京に引っ越しました" }
[[case.step]]
op = { kind = "forget", target = { s = "self", a = "residence", v = "東京" }, echo = false }
[[case.step]]
expect = { facts = [
  { s = "self", a = "residence", v = "大阪", state = "Superseded", by = "(retracted)", sources = ["a1"] },
  { s = "self", a = "residence", state = "Retracted", sources = ["b1"] },
], turns = [
  { id = "a1", text = "私は大阪に住んでいます" },
  { id = "b1", text = "私は[伏せ字]に引っ越しました" },
], table = [] }

