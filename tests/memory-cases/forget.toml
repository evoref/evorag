[[case]]
id = "F09"
title = "private の値は、想起で添える往復の中で [非表示] にする (本文は変えない)"
spec = "04 §7.5"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "えびアレルギーがあります" }
[[case.step]]
turn = { id = "a2", session = "A", at = "2026-01-05T10:00:10Z", role = "assistant", text = "えびを使わない献立にしましょう" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "dietary", v = "えび", e = "えびアレルギーがあります" }
[[case.step]]
op = { kind = "private", target = { s = "self", a = "dietary", v = "えび" } }
[[case.step]]
expect = { turns = [
  { id = "a1", text = "えびアレルギーがあります" },
], recall = [
  { turn = "a1", text = "[非表示]アレルギーがあります" },
  { turn = "a2", text = "[非表示]を使わない献立にしましょう" },
], table = [] }

[[case]]
id = "F10"
title = "セッションを消すと、その事実と出典のターンが消える"
spec = "04 §7.1、AC-FR-309-3"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-01-05T10:00:00Z", text = "私は大阪に住んでいます" }
[[case.step]]
candidate = { turn = "a1", s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
[[case.step]]
turn = { id = "b1", session = "B", at = "2026-02-01T09:00:00Z", text = "ラーメンが好き" }
[[case.step]]
candidate = { turn = "b1", s = "self", a = "likes", v = "ラーメン", e = "ラーメンが好き" }
[[case.step]]
op = { kind = "delete_session", session = "A" }
