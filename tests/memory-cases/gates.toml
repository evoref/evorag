# 抽出の関門 1〜8 (04 §5.1・§5.2)。書式は README.md。
# 会話・作品名・名前はすべて架空 (11 §9.7)。候補は抽出の LLM の出力を固定したもの。

# ---- 受け付ける (基本) ----

[[case]]
id = "G01"
title = "主語を明示した言い切りを受け付ける"
spec = "04 §5.2"
text = "私は大阪に住んでいます"
candidate = { s = "self", a = "residence", v = "大阪", e = "私は大阪に住んでいます" }
expect = "accept"

[[case]]
id = "G02"
title = "他人についての発言は、主語をその人にして受け付ける"
spec = "04 §5.2 の関門 5"
