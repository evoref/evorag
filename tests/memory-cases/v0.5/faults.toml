# 障害の注入の v0.5 の点 (09 §4 の表の v0.5 の行と、§3.5 の v0.3 の止める点)。
# 書式は README.md の「障害の注入」。`points` の点ごとに事例を 1 回ずつ流す。`crash = true` の段の操作の途中で、
# その回の点で強制終了 (子プロセスを kill) し、続く `op = { kind = "restart" }` で起動し直す。
# 会話はすべて架空 (11 §9.7)。

