[[case.step]]
expect = { units = [
  { aspect = "residence", value = "港南台", state = "Live", anchors = ["a1"] },
  { aspect = "residence", value = "汐見坂", state = "Contested", against = "港南台", anchors = ["b1"] },
] }
[[case.step]]
op = { kind = "accept", target = { aspect = "residence", value = "汐見坂" } }
[[case.step]]
expect = { label = "accepted", units = [
  { aspect = "residence", value = "港南台", state = "Superseded", by = "汐見坂", anchors = ["a1"] },
  { aspect = "residence", value = "汐見坂", state = "Live", anchors = ["b1"] },
], profile = ["self/residence=汐見坂"] }
[[case.step]]
op = { kind = "derive", order = "shuffle", seed = 3 }
[[case.step]]
expect = { same_as = "accepted" }
[[case.step]]
op = { kind = "forget", target = { aspect = "residence", value = "汐見坂" } }
[[case.step]]
expect = { units = [
  { aspect = "residence", value = "港南台", state = "Superseded", by = "(none)", anchors = ["a1"] },
], ends = [{ aspect = "residence", value = "港南台", turn = "b1" }], not_live = ["self/residence=港南台"], profile = [] }

