[[case]]
id = "GV04"
title = "採る (accept) は指示の時点で Contested を今の値にし、導き直しても同じ。採った値を忘れると前の値は end で終わる"
spec = "04 §7.4 の /memory accept、§7.5 の accept・revert の当て方、当てる時点"
ac = ["AC-FR-317-1"]
stage = "M5.4"
[[case.step]]
