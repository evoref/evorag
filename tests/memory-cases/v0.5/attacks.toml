[[case]]
id = "AT11"
title = "伏せ字の印を値にする型と、値が印に接する型は redaction_marker で捨て、忘れた値を覚え直さない"
spec = "04 §5.2 の関門 6 (伏せ字の印)"
ac = ["AC-NFR-504-3"]
stage = "M5.3"
