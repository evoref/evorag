[[case]]
id = "AT07"
title = "他人についての発話を利用者のことにさせる型: 他人の言葉の引用の中の値と、self 以外を許さない属性の他人の値は捨てる"
spec = "04 §5.2 の関門 4・5"
ac = ["AC-NFR-504-3", "AC-FR-314-1"]
stage = "M5.3"
note = "引用の括弧の無い他人の文 (「妻は看護師です」) を LLM が self に付けた候補は、主語の一致の関門では止まらない (根拠の文に self の呼び名は要らない)。ここには関門で止まる型だけを書く"
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-06-19T10:00:00Z", text = "妹は「私は札幌に住んでいる」と言っていました。" } # 1
[[case.step]]
