  { sentence = 1, aspect = "residence", value = "札幌" },
  { sentence = 2, entity = "妻", aspect = "skill", value = "ピアノ" },
  { sentence = 3, aspect = "residence", value = "Denver" },
] }
[[case.step]]
op = { kind = "derive" }
[[case.step]]
expect = { units = [], profile = [], counts = { quoted = 2, subject = 1 } }

