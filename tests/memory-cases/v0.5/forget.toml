# 忘れるの網羅の試験 (v0.5)。09 §3.5.2 の置き場所の表・5 つの事例の (1)〜(3)、04 §7.1〜§7.6・§7.9。
# 書式は README.md。会話はすべて架空 (11 §9.7)。
# 試験の値 (markers) は、事例の中のほかの本文と重ならない目印の文字列にする。
# `modes = ["redact", "keep"]` の事例は、伏せ字にする忘れるとしない忘れるの両方で流す (09 §3.5.2)。
# 文番号は、区切りの中の利用者の発話の文に 1 から通しで振る (04 §5.2)。各発話の後ろの注に番号を書く。

# ---- 置き場所ごと (09 §3.5.2 の表) ----

[[case]]
id = "FG01"
title = "ターンの本文: 伏せ字にすると印に置き換わり改訂の番号が上がる。伏せ字にしないと本文は変わらず、想起で [非表示] になる"
spec = "09 §3.5.2 (ターンの本文)、04 §7.1・§7.3・§7.5"
ac = ["AC-FR-318-1"]
stage = "M5.4"
modes = ["redact", "keep"]
markers = ["霧ヶ丘"]
[[case.step]]
turn = { id = "a1", session = "A", at = "2026-03-02T10:00:00Z", text = "私は霧ヶ丘に住んでいます。" } # 1
[[case.step]]
turn = { id = "a2", session = "A", at = "2026-03-02T10:00:10Z", role = "assistant", text = "霧ヶ丘にお住まいなんですね。" }
[[case.step]]
segment = { name = "S1", pairs = ["a1"] }
[[case.step]]
ledger = { name = "L1", seg = "S1", keys = ["住まいの話"], units = [
  { sentence = 1, aspect = "residence", value = "霧ヶ丘" },
] }
[[case.step]]
op = { kind = "derive" }
[[case.step]]
expect = { units = [
  { aspect = "residence", value = "霧ヶ丘", state = "Live", anchors = ["a1"] },
], profile = ["self/residence=霧ヶ丘"] }
[[case.step]]
op = { kind = "forget", target = { aspect = "residence", value = "霧ヶ丘" } }
[[case.step]]
expect = { mode = "redact", turns = [
  { id = "a1", text = "私は[伏せ字]に住んでいます。", rev = 1 },
  { id = "a2", text = "[伏せ字]にお住まいなんですね。", rev = 1 },
], units = [], profile = [], requests = 0 }
[[case.step]]
expect = { mode = "keep", turns = [
  { id = "a1", text = "私は霧ヶ丘に住んでいます。", rev = 0 },
  { id = "a2", text = "霧ヶ丘にお住まいなんですね。", rev = 0 },
], recall = [
  { turn = "a1", text = "私は[非表示]に住んでいます。" },
  { turn = "a2", text = "[非表示]にお住まいなんですね。" },
], units = [], profile = [], requests = 0 }

[[case]]
