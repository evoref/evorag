[package]
name = "xtask"
description = "evorag の開発用の作業コマンド (cargo xtask ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
evorag-types = { workspace = true }
evorag-store = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# 配布物のハッシュと署名の検証 (cargo xtask dist / verify-release、12 §5)。xtask だけの依存。
sha2 = { workspace = true }
minisign-verify = "0.2"

[lints]
workspace = true
