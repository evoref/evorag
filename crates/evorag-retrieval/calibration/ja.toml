# リランカーのしきい値の較正の事例 (05 §3.7、S-14)。プロンプトの言語は ja。
# 評価の事例 (tests/retrieval/) とは別の会話と問いにしている (同じ事例でしきい値を求めて測ると、良く見えすぎるため)。
# 会話はすべて架空で、実在の人物・個人情報を含まない (11 §9.7)。
#
# [[session]]: id・日付・題と、ターン ("U: " は利用者、"A: " は応答)。
#   ターンの ID は "<id>-tMM" (MM は 1 から。奇数が利用者、偶数が応答)。
# [[case]]: id・区分 (easy / variant / para / none)・問いのセッション ("new" か、候補から除くセッション)・
#   正解のターン (空なら関係の無い問い)・問い。
#   関係の無い問い (none) の N01〜N12 は、どれかのセッションと同じ話題で、過去の会話に答えの無い問い (近い話題の外れ)。
#   N13〜N24 は、過去の会話の要らない、ふつうの別の話題の問い。

[[session]]
id = "s01"
date = "2026-03-08"
title = "金沢旅行"
turns = [
  "U: 4月に金沢へ一泊二日で行くんだけど、東京から北陸新幹線でどれくらいかかる？",
  "A: 東京から金沢は、北陸新幹線のかがやきで約2時間30分です。停車駅の多いはくたかだと3時間ほどかかります。",
  "U: 兼六園は朝何時から入れる？",
  "A: 兼六園は3月から10月中旬までは朝7時に開園します。早朝は人が少なく、徽軫灯籠の前で写真を撮りやすいです。入園料は大人320円です。",
  "U: 近江町市場で海鮮丼を食べたいんだけど、混む時間は？",
  "A: 近江町市場は11時から13時が最も混みます。10時前に着けば、行列の短いうちに入れることが多いです。水曜日は休む店があるので気をつけてください。",
  "U: ひがし茶屋街では何をしたらいい？",
  "A: 金箔を使ったソフトクリームや、金箔貼りの体験が人気です。体験は30分ほどで、箸や手鏡を作れます。夕方は観光客が減って、町並みがきれいに見えます。",
  "U: 21世紀美術館にも行きたい。予約はいる？",
  "A: 無料の交流ゾーンは予約なしで入れます。展覧会のゾーンは日時指定の券が要ることがあるので、前日までにウェブで取っておくと安心です。",
  "U: 市内の移動はどうするのがいい？",
  "A: 金沢駅から兼六園や茶屋街へは周遊バスが便利です。一日乗り放題の券が800円なので、3回以上乗るなら得になります。",
]

[[session]]
id = "s02"
date = "2026-05-20"
title = "広島と宮島"
turns = [
  "U: 6月に広島と宮島を回るつもり。広島駅から宮島へはどう行く？",
  "A: JR山陽本線で宮島口駅まで約30分、そこからフェリーで10分です。JRのフェリーなら、JRの周遊のパスも使えます。",
  "U: 厳島神社の大鳥居を、海の上にあるところで見たい。いつ行けばいい？",
  "A: 満潮の前後2時間ほどが、鳥居が海に浮かんで見える時間です。干潮のときは鳥居の根元まで歩いて行けます。前日に潮見表を確かめておくと良いです。",
  "U: 宮島で食べておきたいものは？",
  "A: 焼き牡蠣とあなごめしが名物です。あなごめしは人気の店だと昼に1時間待つこともあるので、11時前に並ぶか、持ち帰りの弁当にすると楽です。",
  "U: 弥山に登るのは大変？",
  "A: ロープウェイで獅子岩駅まで上がれば、山頂までは歩いて30分ほどです。足元が岩場なので、スニーカーで行ってください。全部歩いて登ると片道1時間半から2時間かかります。",
  "U: 広島の市内では平和記念公園にも行きたい。",
  "A: 原爆ドームと平和記念資料館は、路面電車の原爆ドーム前で降りてすぐです。資料館の見学には1時間半ほど見ておくと良いです。",
  "U: 夜はお好み焼きを食べたいんだけど、どこがいい？",
  "A: お好み焼きの店が何軒も集まった建物が便利です。広島風はそばかうどんを選べるので、初めてならそば入りの肉玉が定番です。",
]

[[session]]
id = "s03"
date = "2026-01-17"
title = "手作り餃子"
turns = [
  "U: 家で餃子を50個くらい包みたい。あんの分量は？",
  "A: 豚ひき肉300g、キャベツ1/4個 (約300g)、ニラ1束、にんにくとしょうが各1かけが目安です。皮は大判を50枚用意してください。",
  "U: キャベツの水分でべちゃっとしない？",
  "A: みじん切りにしたキャベツに小さじ1/2の塩をふって10分置き、布巾で固く絞ると水っぽくなりません。",
  "U: 肉の下味はどうつける？",
  "A: ひき肉に醤油・酒・ごま油を各大さじ1、オイスターソースを小さじ2入れ、粘りが出るまで1分ほど練ってから野菜を混ぜます。",
  "U: きれいに焼くコツは？",
  "A: フライパンに油をひいて並べ、中火で1分焼いたら、熱湯を餃子の高さの1/3まで入れて蓋をし、5分蒸し焼きにします。水が無くなったら蓋を取り、ごま油を回しかけて焼き色をつけます。",
  "U: 余ったら冷凍しておける？",
  "A: 包んだらバットに間をあけて並べ、生のまま冷凍してから袋に移すとくっつきません。焼くときは凍ったまま並べ、熱湯を少し多めにします。保存は1か月が目安です。",
  "U: たれは何がおすすめ？",
  "A: 定番は醤油と酢を1対1にしてラー油を足したものです。酢にこしょうをたっぷり入れただけの酢こしょうも、さっぱりしておすすめです。",
]

[[session]]
id = "s04"
date = "2026-02-01"
title = "友だちと寄せ鍋"
turns = [
  "U: 週末に友だち4人で寄せ鍋をしたい。だしはどう取る？",
  "A: 水1.5Lに昆布10cmを30分浸してから火にかけ、沸く直前に昆布を出します。かつお節30gを入れて2分煮て漉せば、4人分のだしになります。",
  "U: 味つけの割合は？",
  "A: だし1.5Lに薄口醤油とみりんを各大さじ4、塩を小さじ1/2が目安です。具から味が出るので、最初は薄めにしておきます。",
  "U: 具は何をどれくらい買えばいい？",
  "A: 4人なら鶏もも肉400g、たら4切れ、えび8尾、白菜1/4株、長ねぎ2本、しいたけ1パック、豆腐1丁ほどで足ります。",
  "U: 入れる順番はある？",
  "A: 火の通りにくい鶏肉と白菜の芯を先に入れ、5分ほど煮たら魚介ときのこ、最後に白菜の葉と豆腐を入れます。えびは煮すぎると固くなるので、3分ほどで食べます。",
  "U: しめは何にしよう。",
  "A: 雑炊にするなら、ご飯2膳分を軽く洗ってぬめりを取ってから入れ、溶き卵2個を回し入れて火を止めます。刻みねぎをのせて蓋をし、1分蒸らします。",
]

[[session]]
id = "s05"
date = "2026-04-11"
title = "洗面台の水漏れ"
turns = [
  "U: 洗面台の下の収納が濡れてる。どこから漏れてるか、どう調べればいい？",
  "A: 乾いたティッシュを、給水管のナット、止水栓、排水トラップのつなぎ目に順に当てて、どこが湿るかを見ます。水を流したときだけ濡れるなら排水側、流さなくても濡れるなら給水側です。",
  "U: 水を流したときだけ濡れるみたい。",
  "A: 排水側ですね。S字の排水トラップの、上下2か所の袋ナットのゆるみか、パッキンの劣化が多いです。まず手でナットを締め直して、様子を見てください。",
  "U: 締めてもまだにじむ。",
  "A: パッキンの交換が要ります。ホームセンターで、排水管の径 (多くは32mm) に合う平パッキンが数百円で買えます。トラップを外す前に、下にバケツを置いてください。",
  "U: 外すときの手順は？",
  "A: 上と下のナットを反時計回りにゆるめ、トラップをまっすぐ下に抜きます。中にたまった水と髪の毛が出るので、ついでに掃除すると良いです。新しいパッキンは向きを確かめて入れます。",
  "U: つけ直したあとの確認は？",
  "A: 洗面ボウルに水を半分ためてから一気に流し、つなぎ目にティッシュを当てて濡れないかを見ます。翌日にもう一度見ると安心です。",
  "U: 給水管のほうも、ついでに点検しておくべき？",
  "A: 止水栓のハンドルの根元から垂れていないかを見てください。そこが漏れるならスピンドルのパッキンで、止水栓を閉めてから交換します。賃貸なら、先に管理会社に連絡してください。",
]

[[session]]
id = "s06"
date = "2026-06-07"
title = "網戸の張り替え"
turns = [
  "U: 猫に網戸を破られた。自分で張り替えられる？",
  "A: できます。網、押さえゴム、網戸用のローラー、カッターがあれば、1枚30分ほどです。網は、ペットが引っかいても破れにくいペット用の網がおすすめです。",
  "U: 押さえゴムの太さはどう選ぶ？",
  "A: 古いゴムを1cmほど切ってホームセンターに持っていき、同じ太さを選びます。多くは5.5mmか6.0mmです。",
  "U: 網はどのくらいの大きさを買えばいい？",
  "A: 網戸の枠より、縦横それぞれ5cm以上大きいものを用意します。幅91cmの網戸なら、幅100cmの網が扱いやすいです。",
  "U: たるまないように張るには？",
  "A: 網を洗濯ばさみで枠に仮止めし、短い辺から長い辺の順に、ローラーでゴムを押し込みます。角はローラーの反対側のへらで押し込みます。網を引っぱりすぎると枠が内側に曲がるので注意してください。",
  "U: 余った網はどう切る？",
  "A: ゴムを入れ終わったら、溝の外側に沿って、カッターの刃を寝かせて切ります。刃を新しく折っておくと、網がほつれにくいです。",
  "U: 網戸の外れ止めも直したほうがいい？",
  "A: 外れ止めは網戸の上の左右にある部品で、ねじをゆるめて上に上げると外れにくくなります。張り替えて網戸を戻したら、必ずかけ直してください。",
]

[[session]]
id = "s07"
date = "2026-02-21"
title = "柴犬の子犬のしつけ"
turns = [
  "U: 生後3か月の柴犬を迎えた。トイレのしつけはどうする？",
  "A: 起きた直後、食後、遊んだ後の3つのときに、トイレシートへ連れて行きます。できたらすぐにほめて、おやつを1粒あげます。失敗しても叱らず、においの残らない消臭剤で片づけます。",
  "U: 甘噛みがひどいんだけど。",
  "A: 噛まれたら「痛い」と短く言って、10秒ほど遊ぶのをやめて離れます。噛んでいいロープのおもちゃを渡して、そちらを噛んだらほめます。",
  "U: 散歩はいつから行ける？",
  "A: 最後のワクチンから2週間たてば散歩できます。最初は1回10分ほどから始め、それまでは抱っこで外の音に慣らすのも良いです。",
  "U: ごはんは1日何回？",
  "A: 生後3か月なら1日3回から4回に分けます。パッケージの体重あたりの量を目安に、肋骨を触って分かるくらいの体型を保ってください。6か月を過ぎたら1日2回にします。",
  "U: 夜鳴きするんだけど。",
  "A: クレートに入れて、飼い主のにおいのついたタオルを入れておくと落ち着きやすいです。鳴くたびに出すと覚えてしまうので、トイレ以外では出さないようにします。",
  "U: 柴犬のブラッシングは？",
  "A: 換毛期の春と秋は毎日、それ以外は週2回、スリッカーブラシで毛の流れに沿ってとかします。抜け毛はラバーブラシのほうが取りやすいです。",
  "U: 狂犬病の予防注射と登録も要るよね。",
  "A: 生後91日を過ぎたら30日以内に狂犬病の予防注射を受け、市区町村に登録します。その後は毎年4月から6月に注射します。",
]

[[session]]
id = "s08"
date = "2026-01-25"
title = "鉢植えのバラの手入れ"
turns = [
  "U: 庭に鉢植えのバラが3鉢ある。冬の剪定はいつやればいい？",
  "A: 四季咲きのバラは、1月下旬から2月中旬が冬剪定の時期です。芽が動き出す前に、全体の高さの半分くらいまで切り戻します。",
  "U: どこで切ればいい？",
  "A: 外向きについている芽の5mmほど上を、斜めに切ります。枯れた枝や、鉛筆より細い枝は付け根から切り取ります。",
  "U: 肥料はいつあげる？",
  "A: 剪定の後の2月に寒肥として緩効性の固形肥料を、春の芽吹きと花の後にも追肥します。鉢植えなら1鉢に固形肥料を5〜6粒が目安です。",
  "U: 植え替えも要る？",
  "A: 鉢植えは2年に1回、1月から2月に植え替えます。ひと回り大きい鉢に、バラ用の培養土で植え替え、根を3分の1ほどほぐします。",
  "U: 春になると葉に黒い点が出るんだけど。",
  "A: 黒星病です。病気の葉は取り除いてゴミに出し、雨の泥はねを防ぐためにバークチップで土を覆います。予防として薬剤を2週間おきに散布します。",
  "U: アブラムシも毎年つく。",
  "A: 新芽についたら、粘着テープで取るか、水で勢いよく流します。数が多いときは、浸透移行性の粒剤を株元にまいておくと1か月ほど効きます。",
]

[[session]]
id = "s09"
date = "2026-03-29"
title = "固定費の見直し"
turns = [
  "U: 毎月の固定費を下げたい。何から見直すのがいい？",
  "A: 効果の大きい順に、通信費、保険、サブスクリプション、電気とガスの契約です。まず1か月分の明細を出して、毎月同じ額で引き落とされるものに印をつけてください。",
  "U: スマホは大手のキャリアで月8,000円くらい払ってる。",
  "A: データを月3GBほどしか使わないなら、格安SIMで月1,000円前後に下げられます。乗り換えは番号をそのまま使えるMNPで、手続きはオンラインで1時間ほどです。年間で8万円ほど浮きます。",
  "U: 保険は何を確かめればいい？",
  "A: 保障の重複を見ます。医療保険と共済の両方に入っていないか、子どもが独立したのに死亡保障が大きすぎないかを確かめます。勤め先の団体保険もあわせて見てください。",
  "U: サブスクがいくつあるか分からない。",
  "A: クレジットカードの明細を3か月分さかのぼって、毎月の少額の引き落としを全部書き出します。半年使っていないものは解約し、年払いのほうが安いものは年払いに替えます。",
  "U: 浮いたお金はどうする？",
  "A: 先に、生活費の6か月分を普段の口座とは別の口座にためます。たまったら、残りを積立にまわすと良いです。",
  "U: 家計簿は続かないんだけど。",
  "A: 細かく書かずに、固定費・食費・それ以外の3つに分けて、月末に合計だけ記録する方法なら続けやすいです。キャッシュレスの決済を1枚のカードにまとめると、合計を出すのが楽になります。",
]

[[session]]
id = "s10"
date = "2026-07-12"
title = "ピアノを再開する"
turns = [
  "U: 子どものころ習っていたピアノを、20年ぶりに再開したい。電子ピアノを買うなら何を見ればいい？",
  "A: 88鍵で、ハンマーアクションの鍵盤のものを選んでください。指の力がつきやすいです。予算は5万円から10万円が中心で、ヘッドホン端子があれば夜も練習できます。",
  "U: 最初はどんな曲から始めたらいい？",
  "A: ブルグミュラーの25の練習曲の1番「すなおな心」あたりが指慣らしに向いています。好きなポップスのやさしい編曲の楽譜を1冊並行すると、続けやすいです。",
  "U: 1日にどれくらい練習すればいい？",
  "A: 1日20分を毎日続けるほうが、週末にまとめて2時間弾くより上達します。最初の5分は、ハノンのような指の練習にあてると良いです。",
  "U: 左手がついてこない。",
  "A: 片手ずつ、テンポを半分に落として練習します。メトロノームを60に合わせて、弾けたら4ずつ上げていきます。両手で合わせるのは、片手ずつ止まらずに弾けてからにします。",
  "U: 先生に習うべき？",
  "A: 独学でも弾けますが、変な癖がつきやすいので、月に2回のレッスンで姿勢と指の形を見てもらうのがおすすめです。大人向けの教室は、30分で1回3,000円前後が多いです。",
  "U: 楽譜を読むのが遅くなってる。",
  "A: ヘ音記号の音を1日5分、カードやアプリで当てる練習をすると、2週間ほどで読む速さが戻ってきます。",
]

[[session]]
id = "s11"
date = "2026-08-30"
title = "Wi-Fi が夜に切れる"
turns = [
  "U: 家のWi-Fiが夜になるとよく切れる。何が原因？",
  "A: 夜は近所のWi-Fiも増えて、2.4GHz帯が混みやすくなります。ルーターの設定画面で、使っているチャンネルと周波数帯を確かめてください。",
  "U: 2.4GHzと5GHz、どっちにつなげばいい？",
  "A: ルーターと同じ部屋や隣の部屋なら、5GHzのほうが速くて混みにくいです。壁を何枚もはさむ遠い部屋では、2.4GHzのほうが届きやすいです。",
  "U: ルーターはどこに置くのがいい？",
  "A: 家の中心に近い、床から1〜2mの高さに置きます。電子レンジや水槽、金属の棚の近くは電波を弱めるので避けてください。",
  "U: ルーターは買ってから6年くらいたってる。",
  "A: 6年前の機種ならWi-Fi 5以前のことが多いので、Wi-Fi 6の機種に替えると良くなりやすいです。替える前に、ファームウェアの更新と再起動を試してください。",
  "U: 2階の寝室まで届かない。",
  "A: メッシュWi-Fiのサテライトを階段の近くに1台置くと、2階まで同じネットワーク名でつながります。中継器より切り替えが自然です。",
  "U: 再起動はどれくらいの頻度ですればいい？",
