# 事実の抽出の関門の、言語に依らない規則 (04 §5.2 の関門 6、§5.4)。
# 判定は、値を NFKC にして casefold してから行う (全角の記号も半角と同じに扱うため)。
# ここに書く文字と語は、NFKC と casefold で変わらない形で書く (変わる形は永久に当たらない)。
# 規則を変えたら `version` を上げる。

version = 2

# 値に含んだら捨てる、Unicode の一般カテゴリ。
# Cc: 制御文字 (改行・タブ・NEL など)。Cf: 書式の文字 (ゼロ幅文字・双方向の制御文字・BOM・ソフトハイフンなど)。
# Co: 私用領域。Cn: 未割り当て。Cs: サロゲート (Rust の文字列には現れないが、規則として書いておく)。
# ZWJ も Cf なので、つないだ絵文字 (家族の絵文字など) を含む値も捨てる (受け入れる)。
# このほかに、表示されない文字 (Default_Ignorable_Code_Point。異体字セレクタ・ハングルの埋め字など) を、
# コードの表 (chars.rs) で捨てる。
forbidden_categories = ["Cc", "Cf", "Co", "Cn", "Cs"]

# 値に含んだら捨てる、そのほかの文字 (行と段落の区切り、表の区切り、空白に見える点字の空白 U+2800)。
# 全角の縦線 (U+FF5C) は NFKC で "|" になる。罫線の縦線 (U+2502) は NFKC でも残る。
forbidden_chars = [" ", " ", "|", "│", "⠀"]

# 値に含んだら捨てる、URL とスキームの印 (部分一致)。
url_markers = ["://", "www.", "http:", "https:", "javascript:", "data:"]

# 値に含んだら捨てる、役割の詐称と区切りの模倣 (部分一致)。
# 事実の表は信頼しない引用の枠の外に置くので (05 §4.3)、会話の役割や区切りに見える並びを入れない。
# このほかに、`<` の直後に英字・`/`・`|`・`!` が続く並び (会話の型のタグ) を、コードで捨てる。
role_markers = [
  "[inst]", "[/inst]", "<<sys>>", "<</sys>>", "<s>", "</s>", "<|", "|>", "```", "</",
]

# 役割の語。後ろに role_colons の文字が (空白を挟んでも) 続いたら捨てる (部分一致)。
role_words = [
  "system", "user", "assistant", "developer", "model", "human",
  "システム", "アシスタント", "ユーザー", "ユーザ",
]
# 役割の語の後のコロン。全角 (U+FF1A) と小さいコロン (U+FE55) は NFKC で ":" になる。
# ∶ は U+2236 (RATIO)、꞉ は U+A789、ː は U+02D0。
role_colons = [":", "∶", "꞉", "ː"]
