# 事実の抽出の関門の、言語に依らない規則 (04 §5.2 の関門 6、§5.4)。
# 判定は、値を NFKC にして casefold してから行う (全角の記号も半角と同じに扱うため)。
# ここに書く文字と語は、NFKC と casefold で変わらない形で書く (変わる形は永久に当たらない)。
# 規則を変えたら `version` を上げる。

version = 1

# 値に含んだら捨てる、Unicode の一般カテゴリ。
# Cc: 制御文字 (改行・タブ・NEL など)。Cf: 書式の文字 (ゼロ幅文字・双方向の制御文字・BOM・ソフトハイフンなど)。
# ZWJ も Cf なので、つないだ絵文字 (家族の絵文字など) を含む値も捨てる (受け入れる)。
forbidden_categories = ["Cc", "Cf"]

# 値に含んだら捨てる、そのほかの文字 (行と段落の区切り、表の区切り)。
# 全角の縦線 (U+FF5C) は NFKC で "|" になる。罫線の縦線 (U+2502) は NFKC でも残る。
forbidden_chars = [" ", " ", "|", "│"]

# 値に含んだら捨てる、URL とスキームの印 (部分一致)。
url_markers = ["://", "www.", "http:", "https:", "javascript:", "data:"]

# 値に含んだら捨てる、役割の詐称と区切りの模倣 (部分一致)。
# 事実の表は信頼しない引用の枠の外に置くので (05 §4.3)、会話の役割や区切りに見える並びを入れない。
role_markers = [
  "system:", "assistant:", "user:", "システム:", "アシスタント:", "ユーザー:",
  "[inst]", "[/inst]", "<<sys>>", "<</sys>>", "<s>", "</s>", "<|", "|>", "```", "</",
]
