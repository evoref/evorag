# v0.5 の関門 (B3) で足した規則と、辞書の v0.5 の宣言 (04 §5.1・§5.2)。
#
# 旧エンジンと共有する規則の型 (`rules.rs` の `LanguageRules`・`Attributes`。知らない項目を拒む) を変えずに足す
# ため、旧エンジンを外す (08 §2.6 の M5.5) までは、このファイルに置く (04 §5.2 の「規則の TOML」)。
#
# 規則:
# - 照合は NFKC と casefold の後に行う。ここに書く語は、NFKC と casefold で変わらない形で書く。
# - 規則を変えたら `version` を上げる (導出の指紋に入る、04 §5.3)。
# - 関門 3b の否定の印・節の区切りと、関門 6a の機微な情報は、同梱のすべての言語のものを合わせて当てる。
# - 日本語の語は部分一致、英語の語は ASCII の英数字で決めた語の境界で当てる。[sensitive] の英語の語の末尾の `*` は、
#   語の頭だけに境界を求める (語幹。`pregnan*` は "pregnant"・"pregnancy" に当たる)。
# - *_exclude・exclude の語の一致 1 つにすっかり収まる一致は数えない (照合の前に伏せる)。
# - [sensitive] の語の一覧は初版。v0.5 のリリースの準備で利用者が見直す (OQ-56)。

version = 1

[dictionary]
# 辞書の属性の v0.5 の宣言 (04 §5.1 の「辞書」)。attributes.toml の属性の名前で書く。
# 層: v0.5 の辞書の属性はすべて world (書かない属性は world)。
# 別名: 初版は空 (自由記述の属性を辞書の属性に写す語。足したら attributes.toml の version も上げる)。
# 値の意味が否定を含む属性 (`negative`): 関門 3b (極性) の否定の印を見ない。「えびは食べられません」を fact とする
# 属性 (attributes.toml の describe のとおり)。negated は、negative_end の語がある文だけ通す。
negative = ["dietary"]

[dictionary.aliases]

[subject]
# 関門 5: 応答する側を表す語 (04 §5.2)。正規化 v1 か照合の形で同じ呼び名を捨てる (部分一致ではない)。
# 役割の語 (rules/common.toml の role_words) も同じく捨てる。モデルの名前 (人の名前と見分けられない) は入れない。
assistant = ["assistant", "ai", "アシスタント", "システム", "bot", "ボット", "チャットボット", "chatbot"]
# 関門 5: 二人称 (応答する側を指す)。同じ呼び名を捨てる。
second_person = [
  "あなた", "あんた", "君", "きみ", "お前", "おまえ", "貴方", "貴女", "そちら", "you", "your", "yours",
  "yourself", "u",
]

[ja]
# 関門 3b の否定の印 (`negation_mark`)。日本語は述語が節の最後に来るので、値の後ろから節の終わりまでで見る。
negation_mark = [
  "ない", "ません", "無い", "なかっ", "なく", "なし", "ずに", "せず", "ず、", "ず。", "ずじまい", "へん", "ねえ",
]
# negation_mark の一致が、この語の一致 1 つにすっかり収まるときは、否定とみなさない (照合の前に伏せる)。
negation_mark_exclude = [
  "間違いない", "違いない", "少なくない", "少ない", "すくない", "少なく", "すくなく", "仕方ない", "仕方がない",
  "しょうがない", "危ない", "あぶない", "もったいない", "つまらない", "くだらない", "情けない", "切ない",
  "せつない", "頼りない", "物足りない", "たまらない", "堪らない", "半端ない", "はんぱない", "欠かせない",
  "手放せない", "止まらない", "やめられない", "忘れられない", "外せない", "見逃せない", "かもしれない",
  "かも知れない", "しかない", "ほかならない", "他ならない", "なければならない", "なくてはならない",
  "ないといけない", "なきゃいけない", "おさない", "きたない", "ないしょ", "間もなく", "まもなく", "なくした",
  "なくしもの", "おとなし", "はなし", "かなし", "まず、", "まず。", "必ず、", "かならず、", "たいへん", "へんな",
  "このへん", "そのへん", "あのへん", "どのへん", "へんじ", "ねえさん", "ねえちゃん", "だねえ", "よねえ", "すねえ",
  "ねえ、", "ねえ。",
]
# 関門 3b の節の区切り。読点だけでは切らない (「東京には、もう住んでいません」の否定を値の節に入れるため)。
polarity_clause_break = [
  "けど", "けれど", "が、", "ので", "から、", "し、", "ながら", "ていて", "でいて", "て、", "で、", ";",
  "ですが", "ますが", "たが", "だが",
]
# 値の意味が否定を含む属性の negated を通す、否定を終える語 (値を言った文にどれかが要る)。
negative_end = [
  "食べられるようになっ", "飲めるようになっ", "治っ", "治りました", "もう大丈夫", "平気になっ", "克服",
  "アレルギーではなくなっ", "アレルギーじゃなくなっ",
]

