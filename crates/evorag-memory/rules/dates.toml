# 日付の表現の規則 (04 §5.1 の「日付」。導出 (B4) で `when` を決定論に解く)。
#
# 旧エンジンと共有する規則の型 (`rules.rs` の `LanguageRules`。知らない項目を拒む) を変えずに足すため、旧エンジンを
# 外す (08 §2.6 の M5.5) までは、このファイルに置く (M5.5 で `rules/<言語>.toml` の `[dates]` に移す)。関門 (B3) の
# 規則 (`rules/b3.toml`) と分けるのは、日付は畳みの中で解き、関門の結果の覚え (04 §5.3) に入らないため。
#
# 規則:
# - 照合は NFKC と casefold の後に行う。ここに書く語は、NFKC と casefold で変わらない形で書く。
# - 日本語の語は部分一致、英語の語は ASCII の英数字で決めた語の境界で当てる。同梱のすべての言語を合わせて当て、
#   どれかで読めれば解く。
# - 表現の中で最も前から始まる一致 (同じ位置なら長い方、数字の形を語より先) を採る。
# - 相対の語は、発話のターンの時刻を、そのターンに記録した UTC からのずれで利用者の暦の日に直してから解く。
#   `day` は日、`week` は月曜から日曜の週、`month` は月、`year` は年のずれ。
# - 絶対の日付の数字の形 (`2026年3月14日`・`3/14`・`2026-03` など) と、英語の月の名前 (`month_names`) はコードの型で
#   読む。年の無い形 (`3月14日`・`3/14`・`March 14`) は、発話の暦の年とする。
# - 規則か読み方のコードを変えたら `version` を上げる (導出の指紋に入る、04 §5.3)。

version = 1

[ja]
day = { "今日" = 0, "本日" = 0, "きょう" = 0, "昨日" = -1, "きのう" = -1, "一昨日" = -2, "おととい" = -2, "明日" = 1, "あした" = 1, "あす" = 1, "明後日" = 2, "あさって" = 2 }
week = { "今週" = 0, "先週" = -1, "先々週" = -2, "来週" = 1, "再来週" = 2 }
month = { "今月" = 0, "先月" = -1, "先々月" = -2, "来月" = 1, "再来月" = 2 }
year = { "今年" = 0, "本年" = 0, "ことし" = 0, "去年" = -1, "昨年" = -1, "きょねん" = -1, "一昨年" = -2, "おととし" = -2, "来年" = 1, "再来年" = 2 }
month_names = []

[en]
day = { "today" = 0, "yesterday" = -1, "tomorrow" = 1, "the day before yesterday" = -2, "the day after tomorrow" = 2 }
week = { "this week" = 0, "last week" = -1, "next week" = 1 }
month = { "this month" = 0, "last month" = -1, "next month" = 1 }
year = { "this year" = 0, "last year" = -1, "next year" = 1 }
month_names = [
  "january", "february", "march", "april", "may", "june",
  "july", "august", "september", "october", "november", "december",
]
