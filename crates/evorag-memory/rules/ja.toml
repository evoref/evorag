# 事実の抽出と訂正の規則 (日本語) (04 §5.2・§5.3・§6)。
# 例はすべて架空で、実在の人物・個人情報を含まない (11 §9.7)。
# 規則を変えたら `version` を上げる。
#
# 当て方 (04 §5.2):
# - [prefilter] の greetings と [safety] は、安全の規則として、同梱のすべての言語のものを合わせて当てる。
# - [prefilter] の min_content_units、[reading]、[correction] は、根拠の文字列の言語で選んで当てる。
# - 照合は NFKC と casefold の後に行う。ここに書く語は、NFKC と casefold で変わらない形で書く。
# - 日本語の語は部分一致で照合する。*_exclude の語の一致 1 つにすっかり収まる一致は数えない
#   (はみ出す一致は数える。値の全体は許さない)。

version = 4
language = "ja"

[prefilter]
# 前のふるいの後の発話の、内容の単位 (05 §2.1) がこれ未満なら、抽出に送らない。
min_content_units = 4
# 前後の空白と記号を除いた発話の全体が、これと一致したら送らない (部分一致ではない)。
greetings = [
  "こんにちは", "こんばんは", "おはよう", "おはよー", "おはようございます", "ありがとう", "ありがと",
  "ありがとうございます", "どうも", "よろしく", "よろしくお願いします", "お疲れさま", "おつかれ",
  "はい", "いいえ", "うん", "ううん", "なるほど", "了解", "了解です", "わかった", "わかりました",
  "おけ", "おk", "いいね", "すごい", "そうなんだ", "そうですね", "おやすみ", "またね", "続けて", "続き",
]

[safety]
# 関門 6: 値に含んだら捨てる、命令形の文と依頼の印。
imperative = [
  "ください", "下さい", "せよ", "するな", "しなさい", "なさい", "してくれ", "無視して", "無視しろ",
  "従って", "従え", "答えるな", "と答え", "で答え", "と返事", "と言って", "と名乗", "振る舞って",
  "ふりをして", "なりきって", "忘れて", "忘れろ", "てほしい", "お願い",
  # て形の依頼 (「英語で話して」)。
  "話して", "答えて", "書いて", "返して", "やめて",
  # 話し方の指定 (「海賊口調で話す」「語尾ににゃを付けて話す」)。
  "口調で話", "口調で答", "口調で返", "語尾に", "を付けて話", "をつけて話",
]
# imperative の一致が、この語の一致 1 つにすっかり収まるときは、命令とみなさない。
imperative_exclude = [
  "するなら", "するなど", "するなんて", "せよう", "してくれる", "してくれた", "してくれて",
  "話してい", "話してる", "話してた", "答えてい", "答えてる", "答えてた", "書いてい", "書いてる",
  "書いてた", "書いてあ", "返してい", "返してる", "返してた", "やめてい", "やめてる", "やめてた",
  "やめてから", "繰り返して", "折り返して",
]
# 関門 6: 値に含んだら捨てる、ほかの指示への言及。単語ではなく句にする
# (「システムエンジニア」「医師の指示による減塩」のような値を捨てないため)。
instruction_refs = [
  "システムプロンプト", "プロンプトを無視", "プロンプトを忘", "指示を無視", "指示を忘", "指示に従",
  "以前の指示", "上記の指示", "これまでの指示", "新しい指示", "新しいルール", "ルールを無視",
  "設定を無視", "命令を無視", "命令に従",
]

# 関門 4: 根拠の中で、値がこの括弧の内側にあれば捨てる (引用・発言の写しとみなす)。
# allow_attributes の属性は、内側でも許す。丸括弧は入れない (「娘 (5 歳)」のような注記に使うため)。
[[safety.quote]]
open = "「"
close = "」"
allow_attributes = ["name"]

[[safety.quote]]
# 『』は作品名に使うことが多いので、作品を入れうる属性では許す。
open = "『"
close = "』"
allow_attributes = ["name", "likes", "hobby", "event", "skill", "goal"]

[[safety.quote]]
# 〝〟は「」と同じく、発言や語の写しに使う。
open = "〝"
close = "〟"
allow_attributes = ["name"]

[[safety.quote]]
# 【】は見出しや強調に使うことが多いが、写した語を囲むこともあるので「」と同じに扱う。
open = "【"
close = "】"
allow_attributes = ["name"]

[[safety.quote]]
open = "“"
close = "”"
allow_attributes = ["name"]

[[safety.quote]]
open = "\""
close = "\""
allow_attributes = ["name"]

[reading]
# 主語を明示する語 (04 §5.3 の置き換えの条件)。根拠にどれかを含めば、主語が `self` と明示されたとみなす。
subject_self = ["私", "わたし", "わたくし", "僕", "ぼく", "俺", "おれ", "自分", "あたし"]
# subject_self に部分一致しても、主語の語とみなさない語 (照合の前に伏せる)。
# 「私の妻」のように、ほかの人を指す形も入れる (主語が自分以外の言い切りで、self の値を置き換えないため)。
subject_self_exclude = [
  "私立", "私鉄", "私服", "私物", "私見", "私的", "私用", "私有", "私設", "私書箱", "私生活", "公私",
  "私大", "私学", "私小説", "私塾", "私企業", "私語", "公僕", "下僕", "自分史", "自分用",
  "私の妻", "私の夫", "私の母", "私の父", "私の娘", "私の息子", "私の兄", "私の姉", "私の弟", "私の妹",
  "私の子", "私の友", "私の彼", "私の上司", "私の同僚", "僕の妻", "僕の母", "僕の父", "僕の娘", "僕の息子",
  "僕の兄", "僕の姉", "僕の弟", "僕の妹", "僕の友", "僕の彼", "俺の妻", "俺の母", "俺の父", "俺の友",
  "自分の妻", "自分の母", "自分の父", "自分の子",
]
# 変化を示す語 (04 §5.3 の置き換えの条件)。主語を省いた言い切りでも、これを含めば置き換える。
# 丁寧語・常体のどちらにも当たるように、語幹で書く。近さだけを示す語 (「最近」) は入れない。
change = [
  "引っ越", "引越", "移住", "転居", "移り住", "転職", "転勤", "異動", "就職", "入社", "退職", "辞め",
  "やめ", "始め", "変わ", "変え", "替え", "買い替", "乗り換", "結婚", "離婚", "卒業", "入学",
  "生まれ", "になった", "になりました", "今は",
]
# change に部分一致しても、変化の語とみなさない語 (照合の前に伏せる、04 §5.2)。
change_exclude = ["相変わらず", "変わらず", "変わらない", "変わってない", "変わっていない", "着替え", "履き替え", "始めまして"]
# 否定の候補で、今の値を終わらせてよい語 (04 §5.3 の「否定」)。
negation_change = [
  "もう", "もはや", "やめた", "やめました", "辞めた", "辞めました", "しなくなった", "じゃなくなった",
  "ではなくなった", "手放した", "別れた", "亡くなった", "引っ越",
]
# 以下の 3 つ (<属性>_cue・question_end・clause_break) は、根拠の言語で選ばず、同梱のすべての言語のものを
# 合わせて、値を言った文に当てる (04 §5.2 の関門 3 の補いと関門 3a)。
# 属性の手がかりの語 (関門 3a の `no_cue`)。attributes.toml で cue = true の属性の候補は、値の位置が掛かる文
# (§6 の文の区切りの文字と改行で切る) にどれかが無ければ捨てる (旅行の行き先・「うち」を住まいにしない)。
# 語幹で書く。照合は生の文 → 正規化 v1 → 照合の形の順。ここに無い言い方 (「地元の大阪で」) は取りこぼす
# (安全の側)。
residence_cue = ["住", "在住", "暮ら", "引っ越", "引越", "移住", "転居", "移り住"]
# 問いの文の終わりの印 (関門 3 の補い)。値の位置が、これで終わる文の最後の節に掛かれば、LLM が言い切りや
# 否定とした候補も問いとして捨てる。全角の「？」は NFKC で「?」になる。
# 「ください」だけは入れない (「ミナトと呼んでください」の名前を捨てないため)。
question_end = ["?", "か", "教えて", "教えてください"]
# 節の区切り (関門 3 の補い)。値の後ろから文の終わりまでにどれかがあれば、値は最後の節に無い
# (「趣味は将棋なんですが、おすすめは？」の将棋は捨てない)。全角の「，」「；」は NFKC で「,」「;」になる。
clause_break = ["、", ",", ";", "ですが", "けど", "ので"]

[correction]
# 訂正の候補を探す一次のふるい。発話にどれかを含むときだけ、patterns を当てる。
triggers = [
  "違", "間違", "じゃなくて", "ではなく", "じゃなく", "訂正", "正しくは", "ではない", "じゃない",
  "ではありません",
]
# 訂正の型 (04 §6)。{old} は訂正される側 (古い値)、{new} は新しい値。
# - 型は向きを決めるためだけに使う。値は検証の LLM の出力を使い、型の穴の位置にあることを確かめる。
# - 当てるときは、固定の部分の長い型から順に試す (「ではなく」より「ではなくて」を先に)。
# - 読点・空白と、文末の「よ」「です」の有無は、照合のときに区別しない。
patterns = [
  "{old}じゃなくて{new}",
  "{old}ではなくて{new}",
  "{old}ではなく{new}",
  "{old}じゃなく{new}",
  "{old}じゃないです、{new}",
  "{old}じゃない、{new}",
  "{old}ではありません。{new}",
  "{old}は間違いで{new}",
  "{old}は間違いです。{new}",
  "{old}は{new}の間違い",
  "{new}、{old}ではなく",
  "{new}です。{old}ではありません",
  "{new}だよ、{old}じゃない",
  "違う、{new}",
  "正しくは{new}",
]
