[package]
name = "evorag-llm"
description = "evorag: llama-server のクライアント (chat・embed・rerank・tokenize・props・slots)。TLS を持たない"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
evorag-types = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "macros", "rt", "net", "io-util", "test-util"] }

[lints]
workspace = true
